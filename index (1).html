/* ---------- DATEI-DOWNLOADS & KALENDER-EXPORT ---------- */
async function saveFile(filename, data, mime){
  const cl = window.claude && typeof window.claude.use === 'function' ? window.claude : null;
  if (cl){
    let dl = null;
    try { dl = await cl.use('downloads'); } catch(e){}
    if (!dl) { toast('Download ist in dieser Ansicht nicht verfügbar.'); return false; }
    try {
      await dl.save({filename, data});
      toast('Datei gespeichert.'); return true;
    } catch(err){
      toast(err && err.code === 'declined' ? 'Download abgebrochen.' : 'Download nicht möglich (' + ((err && err.code) || 'Fehler') + ').');
      return false;
    }
  }
  const b = data instanceof Blob ? data : new Blob([data], {type: mime || 'application/octet-stream'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  return true;
}

function crc32(bytes){ let crc = 0xFFFFFFFF; for (let i = 0; i < bytes.length; i++){ let c = (crc ^ bytes[i]) & 0xFF; for (let k = 0; k < 8; k++) c = c & 1 ? (c >>> 1) ^ 0xEDB88320 : c >>> 1; crc = (crc >>> 8) ^ c; } return (crc ^ 0xFFFFFFFF) >>> 0; }
// verpackt eine Textdatei unkomprimiert als ZIP
function zipOne(name, text){
  const enc = new TextEncoder(); const data = enc.encode(text), fn = enc.encode(name), crc = crc32(data);
  const lh = new Uint8Array(30 + fn.length), cd = new Uint8Array(46 + fn.length), end = new Uint8Array(22);
  const L = new DataView(lh.buffer), C = new DataView(cd.buffer), E = new DataView(end.buffer);
  L.setUint32(0, 0x04034b50, true); L.setUint16(4, 20, true); L.setUint16(6, 0x0800, true); L.setUint16(12, 0x21, true);
  L.setUint32(14, crc, true); L.setUint32(18, data.length, true); L.setUint32(22, data.length, true); L.setUint16(26, fn.length, true); lh.set(fn, 30);
  C.setUint32(0, 0x02014b50, true); C.setUint16(4, 20, true); C.setUint16(6, 20, true); C.setUint16(8, 0x0800, true); C.setUint16(14, 0x21, true);
  C.setUint32(16, crc, true); C.setUint32(20, data.length, true); C.setUint32(24, data.length, true); C.setUint16(28, fn.length, true); cd.set(fn, 46);
  E.setUint32(0, 0x06054b50, true); E.setUint16(8, 1, true); E.setUint16(10, 1, true); E.setUint32(12, cd.length, true); E.setUint32(16, lh.length + data.length, true);
  return new Blob([lh, data, cd, end]);
}
function foldLine(line){
  const enc = new TextEncoder(); let out = '', cur = '', len = 0;
  for (const ch of line){ const b = enc.encode(ch).length; if (len + b > 73){ out += cur + '\r\n '; cur = ''; len = 1; } cur += ch; len += b; }
  return out + cur;
}
const icsEsc = s => String(s ?? '').replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');

function exportIcs(sel, per){
  sel = sel || 'all'; per = per || 'all';
  const sps = sel === 'all' ? S.sprints : S.sprints.filter(s => s.id === sel);
  if (!sps.length) return toast('Keine Sprints vorhanden.');
  const d8 = iso => iso.replace(/-/g, '');
  const now = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
  const L = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Marketing Sprintplaner//DE','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:Marketing Sprintplan'];
  const ev = (uid, start, endExcl, summary, desc, cat) => {
    L.push('BEGIN:VEVENT', 'UID:' + uid + '@sprintplaner', 'DTSTAMP:' + now, 'DTSTART;VALUE=DATE:' + d8(start), 'DTEND;VALUE=DATE:' + d8(endExcl), 'SUMMARY:' + icsEsc(summary));
    if (desc) L.push('DESCRIPTION:' + icsEsc(desc));
    if (cat) L.push('CATEGORIES:' + icsEsc(cat));
    L.push('TRANSP:TRANSPARENT', 'END:VEVENT');
  };
  let n = 0;
  for (const sp of sps){
    if (!sp.start) continue;
    const g = pl(sp.id).reduce((a,x) => a + (+x.stunden||0), 0);
    if (per === 'all' || sp.personId === per){
      ev('sprint-' + sp.id, sp.start, addDays(sp.start, sp.wochen * 7 - 2), 'Sprint: ' + sp.name + (owner(sp) ? ' (Owner ' + owner(sp).name + ')' : ''),
         `${sp.wochen} Woche(n), ${fmt(g)} h geplant`, 'Sprint');
      n++;
    }
    for (const p of pl(sp.id)){
      if (!p.personId || p.week == null) continue;
      if (per !== 'all' && p.personId !== per) continue;
      const t = byId(S.tasks, p.taskId), person = byId(S.people, p.personId);
      const ws = addDays(sp.start, p.week * 7), d0 = p.tag != null ? addDays(ws, +p.tag) : ws;
      ev(p.id, d0, p.tag != null ? addDays(d0, 1) : addDays(ws, 5),
         `${taskLabel(p)}${p.teil ? ' (Teil ' + p.teil + ')' : ''} – ${person ? person.name : ''}`,
         `Sprint: ${sp.name}\nPerson: ${person ? person.name : '–'}\nGeschätzter Aufwand: ${fmt(p.stunden)} h\nKategorie: ${t ? t.kategorie : '–'}`,
         t ? t.kategorie : '');
      n++;
    }
  }
  for (const q of (S.klein || [])){
    if (per !== 'all' && q.personId !== per) continue;
    const person = byId(S.people, q.personId);
    for (const sg of (q.segmente || [])){
      ev('klein-' + q.id + '-' + sg.datum, sg.datum, addDays(sg.datum, 1), `Kleinprojekt: ${kpVoll(q)}${person ? ' – ' + person.name : ''}`, `${fmt(sg.stunden)} h Blockzeit, Deadline ${dat(q.deadline)}`, 'Kleinprojekt');
      n++;
    }
  }
  L.push('END:VCALENDAR');
  const ics = L.map(foldLine).join('\r\n') + '\r\n';
  const who = per === 'all' ? '' : '-' + (byId(S.people, per) || {name:'person'}).name.replace(/[^A-Za-z0-9ÄÖÜäöüß_-]+/g, '_');
  const base = 'sprintplan' + who + '-' + new Date().toISOString().slice(0, 10);
  toast(n + ' Termine erstellt.');
  // In claude.ai sind .ics-Downloads nicht erlaubt, daher dort als ZIP; lokal direkt als .ics
  if (window.claude && typeof window.claude.use === 'function') saveFile(base + '.zip', zipOne(base + '.ics', ics));
  else saveFile(base + '.ics', ics, 'text/calendar;charset=utf-8');
}

    default: return;
  }
  finish(before);
}

app.addEventListener('drop', e => {

  const tgt = d.dataset.drop.split(':');
  const before = snap();
  if (kind === 'S'){
    const s = byId(S.sprints, id); if (!s) return;

    else if (tgt[0] === 'wk' || tgt[0] === 'day'){
      const mo = tgt[0] === 'wk' ? tgt[1] : tgt[2], lane = tgt[0] === 'wk' ? tgt[2] : tgt[1];
      s.start = addDays(mo, -(+off || 0) * 7);
      if (lane && !s.personId){ s.personId = lane; hinweis = `„${s.name}“ startet am ${dat(s.start)}. Owner: ${owner(s).name}.`; }
      else if (lane && s.personId && lane !== s.personId) hinweis = `Termin übernommen. Owner von „${s.name}“ bleibt ${owner(s).name}.`;
    } else return;
    const ein = s.start ? einplanen(s) : null;
    if (finish(before)){ const t = einschubText(s, ein); if (t || hinweis) toast(t || hinweis); }
    return;
  }
  if (kind === 'P'){
    const p = byId(S.placements, id); if (!p) return;
    const ps = byId(S.sprints, p.sprintId);
    if (tgt[0] === 'backlog') S.placements = S.placements.filter(x => x !== p);
    else if (tgt[0] === 'unp' || tgt[0] === 'pool'){ p.week = null; p.tag = null; p.personId = null; manuell(p); }
    else if (tgt[0] === 'cell'){ p.personId = tgt[1]; p.week = +tgt[2]; p.tag = null; manuell(p); }
    else if (tgt[0] === 'day'){
      if (!ps || !ps.start) return toast('Der Sprint dieser Aufgabe hat noch keinen Termin.');
      const w = wdiff(ps.start, tgt[2]), gleich = p.week != null && addDays(ps.start, p.week * 7) === tgt[2] && p.personId === tgt[1];
      if (w < 0 && !gleich) return toast(`„${ps.name}“ beginnt erst am ${dat(ps.start)}.`);
      p.personId = tgt[1]; p.week = w; p.tag = +tgt[3]; if (!gleich) manuell(p);
    } else return;
    finish(before);
    return;
  }
  if (kind === 'T'){
    const sp = sprint(); if (!sp) return toast('Bitte zuerst einen Sprint wählen.');
    if (tgt[0] === 'backlog') return;
    const t = byId(S.tasks, id); if (!t) return;
    const pid = tgt[0] === 'cell' ? tgt[1] : null, week = tgt[0] === 'cell' ? +tgt[2] : null;
    S.placements.push({id: uid(), sprintId: sp.id, taskId: t.id, personId: pid, week, menge: t.einheit ? (t.menge || 1) : null, art: artVon(t), stunden: aufwand(t)});
    finish(before);
  }
});

const kpTitel = q => { const t = q.taskId ? byId(S.tasks, q.taskId) : null; return q.notiz || (t ? taskLabel(q) : 'Kleinprojekt'); };
const kpVoll = q => (q.projekt ? q.projekt + ': ' : '') + kpTitel(q);
// freie Blockzeit einer Person bis zur Deadline, Tag für Tag; ohne markierte Block-Tage gilt die Regel-Blockzeit
function kpPlan(p, h, deadline, ohneId){
  const heute = todayIso(), seg = [], wocheFrei = new Map(), tagBelegt = new Map();
  (S.klein || []).forEach(q => { if (q.id !== ohneId && q.personId === p.id) (q.segmente || []).forEach(sg => tagBelegt.set(sg.datum, (tagBelegt.get(sg.datum) || 0) + (+sg.stunden || 0))); });
  _lm = null;
  let rest = h, frei = 0, d = heute, regel = new Set();
  for (; d <= deadline; d = addDays(d, 1)){
    const i = wd(d) - 1; if (i > 4) continue;
    const mo = mondayOf(d);
    if (!wocheFrei.has(mo)){
      const b = wochenBilanz(p, mo), eigen = (S.klein || []).filter(q => q.id === ohneId).reduce((a, q) => a + (q.segmente || []).filter(sg => mondayOf(sg.datum) === mo).reduce((x, sg) => x + (+sg.stunden || 0), 0), 0);
      wocheFrei.set(mo, Math.max(0, b.B - (b.blockLast - eigen)));
      if (!blockFr(p, mo).some(f => f > 0)) regel.add(mo);
    }
    const bd = blockDays(p, mo), markiert = bd.some(x => x > 0);
    const tagCap = abwTag(p, d) ? 0 : markiert ? bd[i] : (+p.stunden || 0) / 5 * (1 - zielOf(p));
    const tagFrei = Math.max(0, Math.min(tagCap - (tagBelegt.get(d) || 0), wocheFrei.get(mo)));
    frei += tagFrei;
    if (rest > 1e-9 && tagFrei >= 0.25){
      const x = Math.min(rest, Math.floor(tagFrei * 4) / 4);
      if (x > 0){ seg.push({datum: d, stunden: x}); rest -= x; wocheFrei.set(mo, wocheFrei.get(mo) - x); }
    }
  }
  return {seg, frei: Math.floor(frei * 4) / 4, fehlt: Math.max(0, rest), passt: rest <= 1e-9, regel: [...regel]};
}

// Lokale Änderungen ermitteln und senden; neue Datensätze bekommen eine Zeitmarke für eine stabile Reihenfolge
function syncPush(){
  let t0 = Date.now();

  const jetzt = entitaeten(S), up = [], del = [];

  for (const k of sync.letzt.keys()) if (!jetzt.has(k)) del.push(k);

  if (!up.length && !del.length && !metaNeu) return;

    for (const k of SYNC_KINDS) S[k] = [];

    return;
  }
  sync.queue.push({up: up.map(k => { const [kind, id] = teileKey(k); return {kind, id, data: JSON.parse(jetzt.get(k))}; }), del: del.map(teileKey), meta: metaNeu ? S.v : null, zeit: Date.now()});

async function syncFlush(){
  if (sync.sendet || !sync.queue.length || !sync.client) return;
  sync.sendet = true; syncStatus('sendet');
  const von = sync.name || (sync.user && sync.user.email) || '';
  try {
    while (sync.queue.length){
      const p = sync.queue[0];
      const rows = p.up.map(x => ({kind: x.kind, id: x.id, data: x.data, updated_by: von}));
      if (p.meta != null) rows.push({kind: 'meta', id: 'version', data: {v: p.meta}, updated_by: von});
      for (let i = 0; i < rows.length; i += 400){ const {error} = await sync.client.from('planner_entities').upsert(rows.slice(i, i + 400)); if (error) throw error; }
      const nach = {}; p.del.forEach(([kind, id]) => { (nach[kind] = nach[kind] || []).push(id); });
      for (const kind in nach) for (let i = 0; i < nach[kind].length; i += 200){ const {error} = await sync.client.from('planner_entities').delete().eq('kind', kind).in('id', nach[kind].slice(i, i + 200)); if (error) throw error; }
      if (!p.text) p.text = letzterToast.zeit >= p.zeit - 50 && letzterToast.zeit - p.zeit < 3000 ? letzterToast.text : zusammenfassung(p);
      if (p.text && (p.up.length || p.del.length)){ const {error} = await sync.client.from('planner_log').insert({who: von, text: p.text.slice(0, 300)}); if (error) console.warn(error); }
      sync.queue.shift();
    }
    sync.sendet = false; syncStatus(sync.kanalOk ? 'live' : 'offline', '');
  } catch (e) {
    sync.sendet = false;
    const msg = (e && e.message) || String(e);
    if (/row-level security|permission denied|violates/i.test(msg)) return rechteNeuLaden();
    syncStatus('fehler', msg);
    setTimeout(syncFlush, 5000);
  }
}

function syncEmpfang(p){
  if (!sync.letzt) return;
  const typ = p.eventType, row = typ === 'DELETE' ? p.old : p.new;
  if (!row || !SYNC_KINDS.includes(row.kind)) return;
  const k = row.kind + ':' + row.id;
  if (typ === 'DELETE'){ if (!sync.letzt.has(k)) return; sync.letzt.delete(k); setzeEntitaet(k, null); }
  else { const j = JSON.stringify(row.data); if (sync.letzt.get(k) === j) return; sync.letzt.set(k, j); setzeEntitaet(k, j); }

async function syncAlleZeilen(){
  const rows = [];
  for (let von = 0; ; von += 1000){
    const {data, error} = await sync.client.from('planner_entities').select('kind,id,data').order('kind').order('id').range(von, von + 999);
    if (error) throw error;
    rows.push(...(data || [])); if (!data || data.length < 1000) break;
  }
  return rows;
}
function ausZeilen(rows){
  const d = {}; for (const k of SYNC_KINDS) d[k] = [];
  for (const r of rows) if (SYNC_KINDS.includes(r.kind)) d[r.kind].push(r.data);
  for (const k of SYNC_KINDS) d[k].sort((a, b) => (a._t || 0) - (b._t || 0));
  return d;
}
async function syncLaden(){
  const rows = await syncAlleZeilen(), meta = rows.find(r => r.kind === 'meta' && r.id === 'version');

  const d = Object.assign(ausZeilen(rows), {v: meta ? meta.data.v : S.v, settings: S.settings});
  sync.letzt = entitaeten(d); sync.metaV = d.v;
  S = migrate(JSON.parse(JSON.stringify(d)));

async function syncAbgleich(){

    for (const r of rows){ if (!SYNC_KINDS.includes(r.kind)) continue; const k = r.kind + ':' + r.id, j = JSON.stringify(r.data); da.add(k); if (sync.letzt.get(k) !== j){ sync.letzt.set(k, j); setzeEntitaet(k, j); } }

function syncKanal(){

// Zugänge verwalten: Einladungscodes erzeugen, Rollen ändern, Zugänge entfernen
const CODE_ZEICHEN = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function neuerCode(){ const z = new Uint32Array(8); crypto.getRandomValues(z); return [...z].map(x => CODE_ZEICHEN[x % CODE_ZEICHEN.length]).join(''); }
async function sha256hex(t){ const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }

const mitglied = mail => mail ? sync.mitglieder.find(m => m.email === String(mail).trim().toLowerCase()) : null;
async function zugangSetzen(mail, name, rolle){
  zuletztGemerkt = 0;
  mail = String(mail || '').trim().toLowerCase();
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail)) throw new Error('Bitte eine gültige E-Mail-Adresse eintragen.');
  if (sync.user && mail === String(sync.user.email).toLowerCase()) throw new Error('Deinen eigenen Zugang kann nur eine andere verwaltende Person ändern.');
  const m = mitglied(mail);
  if (!rolle){ if (m){ const {error} = await sync.client.from('planner_members').delete().eq('email', mail); if (error) throw error; } delete sync.neueCodes[mail]; await mitgliederLaden(); return null; }
  if (m){ const {error} = await sync.client.from('planner_members').update({role: rolle, name: name || m.name}).eq('email', mail); if (error) throw error; await mitgliederLaden(); return null; }
  const code = neuerCode(), hash = await sha256hex(code);
  const {error} = await sync.client.from('planner_members').insert({email: mail, name: name || mail, role: rolle, code_hash: hash});
  if (error) throw error;
  sync.neueCodes[mail] = code; await mitgliederLaden(); return code;
}
async function codeNeu(mail){
  zuletztGemerkt = 0;
  const code = neuerCode(), hash = await sha256hex(code);
  const {error} = await sync.client.from('planner_members').update({code_hash: hash}).eq('email', mail).is('user_id', null);
  if (error) throw error;
  sync.neueCodes[mail] = code; return code;
}
