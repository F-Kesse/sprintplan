<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sprintplaner Marketing | Sander Pflege</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%27182%20-2%2036%2036%27%3E%3Cpath%20fill%3D%27%239f1739%27%20d%3D%27M215.92%2C15.24h-31.83c.36-8.49%2C7.35-15.24%2C15.92-15.24s15.55%2C6.75%2C15.91%2C15.24Z%20M215.9%2C17.08c-.08%2C1.16-.29%2C2.28-.61%2C3.36h-30.57c-.32-1.08-.53-2.2-.61-3.36h31.79Z%20M214.63%2C22.28c-.53%2C1.21-1.2%2C2.34-2%2C3.37h-25.25c-.8-1.03-1.47-2.16-2-3.37h29.25Z%20M210.98%2C27.49c-2.85%2C2.72-6.71%2C4.38-10.97%2C4.38s-8.12-1.66-10.98-4.38h21.95Z%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f2f2;--card:#ffffff;--text:#1d1d1b;--muted:#6f6566;--line:#e6dada;--line2:#f3ecec;
  --acc:#9f1739;--acc-h:#85122f;--acc-text:#9f1739;--acc2:#f7e9eb;--rose:#c17175;--powder:#deb8b6;
  --ok:#3f7a52;--warn:#a8650f;--bad:#b3261e;--hatch:rgba(159,23,57,.08);
  --font:'Rotis II Sans Pro','Rotis Sans Serif Pro','Rotis Sans Serif','Fira Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#161213;--card:#211b1c;--text:#f2ecec;--muted:#b3a8a9;--line:#3a3032;--line2:#2a2324;
  --acc:#b02a4c;--acc-h:#c43a5d;--acc-text:#eaa7ad;--acc2:#3b2328;--ok:#86c497;--warn:#e3a94f;--bad:#f2907f;--hatch:rgba(234,167,173,.09);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161213;--card:#211b1c;--text:#f2ecec;--muted:#b3a8a9;--line:#3a3032;--line2:#2a2324;
  --acc:#b02a4c;--acc-h:#c43a5d;--acc-text:#eaa7ad;--acc2:#3b2328;--ok:#86c497;--warn:#e3a94f;--bad:#f2907f;--hatch:rgba(234,167,173,.09);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font:15px/1.5 var(--font);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--card)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card)}
header .topbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;max-width:1440px;margin:auto;padding:12px 24px}
.brand{display:flex;align-items:center;gap:16px;margin-right:auto;color:var(--text);text-decoration:none}
.brand .logo{height:44px;width:auto;display:block}
.brand .app{padding-left:16px;border-left:1px solid var(--line);color:var(--muted);font-size:15px;line-height:1.2}
header .stripe{display:grid;grid-template-columns:3fr 2fr 1fr;height:3px}
header .stripe i:nth-child(1){background:#9f1739}header .stripe i:nth-child(2){background:#c17175}header .stripe i:nth-child(3){background:#deb8b6}
nav{display:flex;flex-wrap:wrap;gap:2px}
nav button{background:none;border:0;border-bottom:2px solid transparent;border-radius:0;color:var(--muted);padding:8px 10px;font-weight:500}
nav button:hover{color:var(--text);background:none}
nav button.on{color:var(--acc-text);border-bottom-color:var(--acc)}
main{padding:24px;max-width:1440px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:18px 20px;margin-bottom:16px}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.kpi .v{font-size:32px;font-weight:600;line-height:1.1;color:var(--acc-text)}
.kpi .l{color:var(--muted);font-size:13.5px;margin-top:4px}
.cols{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
h2{font-size:18px;font-weight:600;margin:0 0 12px;letter-spacing:.005em}
button,.btn{font:inherit;font-weight:500;background:var(--acc);color:#fff;border:1px solid var(--acc);border-radius:6px;padding:7px 14px;cursor:pointer;line-height:1.3}
button:hover{background:var(--acc-h);border-color:var(--acc-h)}
button.ghost{background:transparent;color:var(--acc-text);border-color:var(--line)}
button.ghost:hover{background:var(--acc2);border-color:var(--rose)}
button.danger{background:var(--bad);border-color:var(--bad)}
button.danger:disabled,button.danger:disabled:hover{background:var(--bad);border-color:var(--bad)}
button.sm{padding:3px 9px;font-size:13px}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input,select{font:inherit;padding:6px 9px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--text)}
input:focus,select:focus{border-color:var(--rose)}
input[type=number]{width:90px}
table{width:100%;border-collapse:collapse}
td,th{padding:8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{color:var(--muted);font-weight:600;font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bar{height:6px;background:var(--line2);border-radius:3px;overflow:hidden;min-width:80px;margin-top:5px}
.bar>i{display:block;height:100%;background:var(--ok)}
.bar>i.warn{background:var(--warn)}
.bar>i.bad{background:var(--bad)}
.muted{color:var(--muted)}
.small{font-size:13px}
.tag{display:inline-block;font-size:11.5px;padding:0 7px;border-radius:99px;background:var(--acc2);color:var(--acc-text);margin-left:4px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px;vertical-align:middle}
.note{margin:6px 0;padding:7px 10px 7px 12px;border-left:3px solid var(--line);background:var(--line2);border-radius:0 6px 6px 0}
.note.base{border-left-color:var(--powder)}.note.info{border-left-color:var(--rose)}.note.warn{border-left-color:var(--warn)}.note.bad{border-left-color:var(--bad)}.note.ok{border-left-color:var(--ok)}
.plan{display:grid;grid-template-columns:270px 1fr;gap:16px;align-items:start}
.plan>*{min-width:0}
@media(max-width:900px){.plan{grid-template-columns:1fr}}
.catalog{max-height:65vh;overflow:auto;min-height:80px}
.item{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:7px 9px;margin:4px 0;border:1px solid var(--line);border-radius:6px;cursor:grab;user-select:none;background:var(--card)}
.item:hover{border-color:var(--rose)}
.item:active{cursor:grabbing}
.weekwrap{overflow-x:auto;border-radius:6px}
table.wk{min-width:900px}
table.wk td{vertical-align:top;min-width:140px;padding:6px}
table.wk td.lbl{min-width:130px;font-weight:600;background:var(--card);position:sticky;left:0;z-index:1}
.cell{min-height:72px;border:1px dashed var(--line);border-radius:6px;padding:5px;background:var(--bg)}
.cell.over{border:2px solid var(--bad)}
.cell.ext{opacity:.55}
.chip{font-size:13px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--rose);border-radius:5px;padding:4px 6px;margin-bottom:4px;cursor:grab;display:flex;justify-content:space-between;gap:4px;align-items:center}
.chip.unp{border-left-color:var(--warn)}
.chip.lock,.it.block,.dblk.block{background:repeating-linear-gradient(135deg,var(--hatch) 0 6px,transparent 6px 12px),var(--card);color:var(--muted);border-left-color:var(--powder);cursor:default}
.chip input{width:60px;padding:2px 4px;font-size:12px}
.loadline{font-size:12px;color:var(--muted);margin-top:4px}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:12px}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--text);color:var(--card);padding:10px 16px;border-radius:6px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;z-index:40}
.toast.show{opacity:1}
.help li{margin-bottom:10px}
.help h3{margin:20px 0 6px;font-size:16px;font-weight:600}
.hint{background:var(--acc2);border-radius:6px;padding:10px 12px;margin:10px 0}
code{background:var(--acc2);padding:1px 5px;border-radius:4px}
/* Kalender */
.caltool{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.caltool .spacer{flex:1}
.caltitle{font-size:21px;font-weight:600;margin:0 6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{background:transparent;color:var(--text);border:0;border-right:1px solid var(--line);border-radius:0;padding:6px 14px}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--acc2)}
.seg button.on{background:var(--acc);color:#fff}
.seg button.icon{padding:6px 9px;display:inline-flex;align-items:center;color:var(--acc-text)}
.goto{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:14px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:12px;font-size:14px}
.month{margin-bottom:26px}
.month h3{font-size:19px;font-weight:600;margin:0 0 8px}
.mhead,.mweek{display:grid;grid-template-columns:52px repeat(7,minmax(0,1fr))}
.mhead div{font-size:13px;color:var(--muted);padding:4px 8px}
.mweek{border-left:1px solid var(--line);border-top:1px solid var(--line)}
.month .mweek:last-child{border-bottom:1px solid var(--line)}
.mkw{grid-column:1;font-size:12px;color:var(--muted);padding:6px;border-right:1px solid var(--line)}
.mday{padding:3px 8px;font-size:13.5px;border-right:1px solid var(--line);min-height:26px}
.mday.we{background:var(--line2)}
.mday.out{color:var(--muted);opacity:.55}
.mday.today span{background:var(--acc);color:#fff;border-radius:99px;padding:0 7px;font-weight:600}
.lane{grid-column:2 / 9;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));min-height:26px;padding:2px 0;border-right:1px solid var(--line);background:linear-gradient(to right,transparent 71.43%,var(--line2) 71.43%),repeating-linear-gradient(to right,transparent 0,transparent calc(14.2857% - 1px),var(--line2) calc(14.2857% - 1px),var(--line2) 14.2857%)}
.lane.empty{cursor:copy}
.lane.empty:hover{background:var(--acc2)}
.mbar{grid-column:1 / 6;margin:0 4px;border-radius:5px;padding:1px 9px;font-size:13px;line-height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:grab}
.mbar.cl{margin-left:0;border-top-left-radius:0;border-bottom-left-radius:0}
.mbar.cr{margin-right:0;border-top-right-radius:0;border-bottom-right-radius:0}
.loadmore{text-align:center;padding:8px 0 4px}
table.wkv{min-width:860px;table-layout:fixed}
table.wkv th{font-size:14px;color:var(--text);font-weight:600;border-bottom:2px solid var(--line)}
table.wkv th.today{color:var(--acc-text);border-bottom-color:var(--acc)}
table.wkv th .wdn{color:var(--muted);font-weight:500}
table.wkv .pcol{width:170px;vertical-align:top}
table.wkv tr.sprintrow td{border-bottom:0;padding-bottom:2px}
.wbar{border-radius:5px;padding:3px 10px;font-size:13.5px;cursor:pointer}
.wbar .o{opacity:.8;margin-left:8px}
.wbar.none{border:1px dashed var(--line);color:var(--muted);cursor:copy}
.wcell{vertical-align:top}
.wcell.today{background:var(--acc2)}
.it{display:flex;justify-content:space-between;gap:6px;font-size:13px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--rose);border-radius:5px;padding:3px 7px;margin-bottom:4px}
.it b{font-weight:600;white-space:nowrap}
.it.over,.dblk.over{border-color:var(--bad)}
.wsum{font-size:12px;color:var(--muted);margin-top:2px}
.dayv{display:grid;min-width:max-content;padding-bottom:12px}
.dh{padding:8px 10px;border-bottom:1px solid var(--line);font-size:14px}
.dh .chiplink{color:var(--acc-text);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.taxis{position:relative;border-right:1px solid var(--line)}
.taxis span{position:absolute;right:8px;transform:translateY(-50%);font-size:12px;color:var(--muted)}
.taxis span:first-child{transform:none}
.dcol{position:relative;border-right:1px solid var(--line);background:repeating-linear-gradient(to bottom,var(--line2) 0 1px,transparent 1px var(--hh))}
.dcol.free{cursor:copy}
.dblk{position:absolute;left:6px;right:6px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--rose);border-radius:5px;padding:3px 8px;font-size:13px;overflow:hidden;display:flex;flex-direction:column}
.dblk b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dblk span{font-size:12px;color:var(--muted)}
.lane>*{grid-row:1}
.bm{pointer-events:none;margin:2px 0;background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--pc) 55%,transparent) 0 2px,transparent 2px 6px)}
.mbar .t,.wbar .t{padding:0 6px;margin-left:-6px;border-radius:3px}
.bm-key{display:inline-block;width:22px;height:11px;vertical-align:middle;margin:0 7px 0 8px;border-radius:2px;background:repeating-linear-gradient(135deg,var(--muted) 0 2px,transparent 2px 6px)}
.wcell.blkday{background-image:repeating-linear-gradient(135deg,var(--hatch) 0 6px,transparent 6px 12px)}
.days{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.dbtn{background:transparent;color:var(--muted);border:0;border-right:1px solid var(--line);border-radius:0;padding:4px 8px;font-size:13px}
.dbtn:last-child{border-right:0}
.dbtn:hover{background:var(--acc2);color:var(--acc-text)}
.dbtn.on{background:repeating-linear-gradient(135deg,var(--hatch) 0 3px,transparent 3px 7px),var(--acc2);color:var(--acc-text);font-weight:600}
.deps{display:grid;grid-template-columns:1fr 1fr;gap:24px}
@media(max-width:800px){.deps{grid-template-columns:1fr}}
.depchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:6px;padding:3px 4px 3px 9px;margin:0 6px 6px 0;font-size:13.5px;background:var(--card)}
.depchip.bad{border-color:var(--bad)}
.depchip button{padding:0 7px}
table.team{min-width:1080px}
table.team input[type=number]{width:72px}
tr.dim td.lbl{opacity:.6}
.it[draggable]{cursor:grab}
.it.pin{box-shadow:inset 0 0 0 1px var(--rose)}
.it small{display:block;color:var(--muted);font-size:11.5px;line-height:1.3}
.side{max-height:62vh;overflow:auto}
.pgrp{font-size:13px;font-weight:600;margin:10px 0 4px}
.lane.over{box-shadow:inset 3px 0 0 var(--bad)}
.mbar.help{background:transparent;border:1.5px dashed;color:var(--text);cursor:pointer}
.spool{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);z-index:8}
.spool-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;max-height:118px;overflow:auto}
.spool-list .item{margin:0;gap:10px}
.wcell{min-height:64px}
.muted.bad{color:var(--bad)}
[hidden]{display:none!important}
.spacer{flex:1}
.fld{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);font-weight:500}
.fld input,.fld select{font-size:15px;color:var(--text);font-weight:400}
.fld.grow{flex:1;min-width:220px}
.sphead .row{align-items:flex-end}
.sphead .meta{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.sphead .status{margin-top:14px;align-items:center}
.sphead .newsprint{margin-top:12px;padding:12px;border:1px dashed var(--line);border-radius:6px}
button.ghost.danger-text{color:var(--bad)}
button:disabled,button:disabled:hover{opacity:.45;cursor:not-allowed;background:var(--acc);border-color:var(--acc)}
details.deps-card summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:12px}
details.deps-card summary::-webkit-details-marker{display:none}
details.deps-card summary h2{margin:0}
details.deps-card summary::before{content:"";width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);margin:0 2px}
details[open].deps-card summary::before{transform:rotate(45deg)}
details[open].deps-card .deps{margin-top:14px}
.danger-zone{border-color:color-mix(in srgb,var(--bad) 35%,var(--line))}
.dz-row{display:flex;gap:16px;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}
.dz-row button{flex-shrink:0}
ul.plain{margin:8px 0 14px;padding-left:18px;color:var(--muted)}
ul.plain li{margin:4px 0}
ol.steps{margin:6px 0 14px;padding-left:20px}
ol.steps li{margin:6px 0}
.intro{border-left:4px solid var(--acc)}
.spool-tools{margin-top:10px}
.spool-tools input{flex:1;min-width:160px}
.catcard{display:flex;flex-direction:column;gap:10px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 80px);max-height:calc(100vh - 100px)}
@media(max-width:900px){.catcard{position:static;max-height:none}}
.catcard input[type=search]{width:100%}
.catalog{flex:1;overflow:auto;margin:0 -6px;padding:0 6px;min-height:120px}
.cgrp{border-bottom:1px solid var(--line)}
.cgrp summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:9px 2px;font-size:14px;font-weight:600}
.cgrp summary::-webkit-details-marker{display:none}
.cgrp summary::before{content:"";flex-shrink:0;width:6px;height:6px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg)}
.cgrp[open] summary::before{transform:rotate(45deg)}
.cgrp summary span:first-child{flex:1}
.cgrp[open]{padding-bottom:6px}
.cnt{font-size:12px;font-weight:500;color:var(--muted);background:var(--line2);border-radius:99px;padding:0 8px}
.citem{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 10px;border-radius:6px;cursor:grab}
.citem:hover{background:var(--acc2)}
.cbody{flex:1;min-width:0}
.cname{font-size:13.5px;line-height:1.3}
.cmeta{font-size:12px;color:var(--muted);margin-top:1px}
button.cadd{width:26px;height:26px;padding:0;border-radius:50%;background:transparent;color:var(--acc-text);border:1px solid var(--line);font-size:16px;line-height:1;flex-shrink:0}
button.cadd:hover{background:var(--acc);border-color:var(--acc);color:#fff}
.cathint{border-top:1px solid var(--line);padding-top:8px}
.chip{display:block;padding:6px 8px;cursor:grab}
.chip .ctop{display:flex;gap:6px;align-items:flex-start;justify-content:space-between}
.chip .cn{font-size:13px;line-height:1.3}
.chip .cnote{font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.3}
.chip .cbot{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;margin-top:5px}
.chip .q{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.chip .q input{width:54px;padding:2px 4px;font-size:12px}
.chip select{padding:2px 4px;font-size:12px;max-width:120px}
.chip button.x{background:transparent;border:0;color:var(--muted);padding:0 2px;font-size:16px;line-height:1}
.chip button.x:hover{color:var(--bad);background:transparent}
.kgrp{margin-top:20px}
.kgrp h3{font-size:15px;font-weight:600;margin:0 0 6px;display:flex;align-items:center;gap:8px}
table.ktab{min-width:1220px}
table.ktab th{white-space:nowrap}
table.ktab td{padding:4px 6px}
table.ktab input,table.ktab select{padding:4px 6px;font-size:14px}
table.ktab .w-name{width:100%;min-width:360px}
table.ktab select{max-width:190px}
table.ktab .w-unit{width:160px}
table.ktab td.num input{width:78px}
table.ktab .res{white-space:nowrap;font-weight:600}
table.ktab .res .small{font-weight:400}
table.ktab tbody tr:hover td{background:var(--line2)}

const aufwand = (t, m, art) => { const [g, pro] = artWerte(t, art); return (+g || 0) + (t.einheit ? (+pro || 0) * (m == null ? (+t.menge || 1) : +m) : 0); };
const artVon = (t, x) => t && t.varianten ? (x && x.art) || 'entwurf' : null;
const einheitText = (e, m) => (+m === 1 ? e : (PLURAL[e] || e));
const aufwandText = t => t.einheit ? `${+t.stunden ? fmt(t.stunden) + ' h + ' : ''}${fmt(t.proEinheit || 0)} h je ${t.einheit}` : `${fmt(t.stunden)} h`;

      if (!ids.length){ s.personId = d.people[0] ? d.people[0].id : null; continue; }
      const base = s.name;

      Object.assign(t, {kategorie: kat, stunden: basis, einheit: einheit || null, proEinheit: pro || 0, menge: menge || 1, tags: tags || []});

// Rückwärts-Dynamik: automatisch verschobene oder geliehene Teile rücken zurück, sobald in früheren Wochen wieder Platz ist

function kettenVerdichten(){

// Teile einer Aufgabe nummerieren, Teile in derselben Woche zusammenführen
function teileBeschriften(sid){
  const gr = {};
  pl(sid).forEach(x => { const k = x.taskId + '|' + (x.personId || '') + '|' + (x.notiz || ''); (gr[k] = gr[k] || []).push(x); });
  for (const g of Object.values(gr)){
    const proWoche = new Map();
    for (const x of g){
      const k = x.week == null ? 'pool' : x.week + '|' + (x.tag == null ? '' : x.tag), y = proWoche.get(k);
      if (y){ y.stunden = (+y.stunden || 0) + (+x.stunden || 0); if (y.menge == null && x.menge != null) y.menge = x.menge; if (!x.auto){ delete y.auto; delete y.heim; } x._weg = true; } else proWoche.set(k, x);

    const rest = g.filter(x => !x._weg);
    if (rest.length < 2) rest.forEach(x => { delete x.teil; });
    else rest.sort((a, b) => (a.week == null ? 999 : a.week) - (b.week == null ? 999 : b.week)).forEach((x, i) => { x.teil = (i + 1) + '/' + rest.length; });

}
// Personen, deren Abwesenheiten sich geändert haben

// Nach einer Änderung: überplante Wochen der betroffenen Aufgaben und Sprints in die Folgewoche ausgleichen
function ausgleichen(before){

  const altP = new Map(alt.placements.map(x => [x.id, x])), altS = new Map(alt.sprints.map(x => [x.id, JSON.stringify(x)]));
  const geaendert = new Set(S.placements.filter(x => { const a = altP.get(x.id); return !a || a.week !== x.week || a.personId !== x.personId || +a.stunden !== +x.stunden; }).map(x => x.id));

  for (const x of S.placements.filter(q => geaendert.has(q.id) && q.personId)){
    const m = woche(x), p = byId(S.people, x.personId);

    const cand = S.placements.filter(x => x.personId === u.p.id && (touched.has(x.sprintId) || abwP.has(u.p.id)) && woche(x) === u.m).sort((a, b) => ((a.tag != null) - (b.tag != null)) || (b.stunden - a.stunden));

// Offene Kleinprojekte einer Person neu in die freie Blockzeit einplanen, nach Deadline; Vergangenes bleibt stehen
function kleinNeuPlanen(pid){

// Wer ist von einer Änderung an Sprints, Block-Tagen, Buchung oder Aufgaben betroffen?
function kleinNachfuehren(before){

// Rückgängig und Wiederholen: die letzten 40 Schritte, gespeichert als Änderungen einzelner Datensätze.

const undoStack = [], redoStack = [];
let zuletztGemerkt = 0;

function setzeEntitaet(k, json){

}
function merke(json){

function wendeAn(d, zurueck){

}
function undoKnoepfe(){ const u = document.getElementById('undoBtn'), r = document.getElementById('redoBtn'); if (u) u.disabled = !undoStack.length; if (r) r.disabled = !redoStack.length; }
function nachUndo(){ if (!byId(S.sprints, sprintId)) sprintId = S.sprints[0] ? S.sprints[0].id : null; _lm = null; save(); render(); undoKnoepfe(); }
const konfliktText = n => n === 1 ? ' Ein Eintrag wurde inzwischen von jemand anderem geändert und bleibt so.' : n ? ` ${n} Einträge wurden inzwischen von anderen geändert und bleiben so.` : '';
function rueckgaengig(){

function wiederholen(){

let zuletztVerschoben = 0, zuletztWarnung = false, zuletztAusgeglichen = 0, zuletztKlein = 0, zuletztZurueck = 0;
function finish(before, opts){

  if (before){ leihPruefen(); zuletztAusgeglichen = ausgleichen(before); }

      S = JSON.parse(before.json);

      render(); toast('Nicht möglich: ' + neuV.msg);

    }

    if (neu){
      const msg = `Nicht möglich: „${neu[0].name}“ und „${neu[1].name}“ von ${owner(neu[0]) ? owner(neu[0]).name : '–'} würden sich überschneiden.`;
      S = JSON.parse(before.json);
      if (!byId(S.sprints, sprintId)) sprintId = S.sprints[0] ? S.sprints[0].id : null;

      return false;
    }
  }

    if (zuletztAusgeglichen || zuletztVerschoben || zuletztKlein || zuletztGeliehen || zuletztVerdichtet || zuletztZurueck) toast([zuletztZurueck ? `${zuletztZurueck} abhängige(r) Sprint(s) rücken wieder vor` : '', zuletztGeliehen ? `${fmt(zuletztGeliehen)} h aus Nachbar-Sprints geliehen` : '', zuletztAusgeglichen ? `${fmt(zuletztAusgeglichen)} h passten nicht mehr in die Woche und liegen jetzt in der Folgewoche` : '', zuletztVerdichtet ? `${fmt(zuletztVerdichtet)} h sind in frühere Wochen zurückgerückt` : '', zuletztVerschoben ? `${zuletztVerschoben} Folge-Sprint(s) wurden automatisch verschoben` : '', zuletztKlein ? `${zuletztKlein} Kleinprojekt(e) neu in die Blockzeit einsortiert` : ''].filter(Boolean).join('. ') + '.');

}
// Einschieben: Trifft der neue Termin einen Sprint desselben Owners, übernimmt der Sprint dessen Startwoche.

// abhängige Sprints anderer Personen ziehen mit.

// Wochen-Picker: Monate als Zeilen, freie, belegte und gesperrte Wochen des Owners auf einen Blick
function wochenPicker(){
  const neu = pick.ctx === 'new', sp = neu ? null : sprint();
  const pid = neu ? ns.owner : sp && sp.personId, lang = neu ? 1 : (sp ? sp.wochen : 1), cur = neu ? ns.start : sp && sp.start;
  const minS = sp ? minStart(sp) : null, p = pid ? byId(S.people, pid) : null, heute = mondayOf(todayIso());
  const andere = S.sprints.filter(x => pid && x.personId === pid && x.start && (!sp || x.id !== sp.id));
  const belegt = m => andere.find(x => covers(x, m));
  const passt = m => { for (let i = 0; i < lang; i++) if (belegt(addDays(m, i * 7))) return false; return true; };
  let h = `<div class="wpick">
    <div class="row wphead"><b>Start wählen</b><span class="muted small">${p ? `Wochen von ${esc(p.name)}. Der Sprint dauert derzeit ${lang} Woche(n), gewählt wird die erste.` : 'Noch kein Owner gewählt, deshalb sind alle Wochen frei.'}</span><span class="spacer"></span>
      <button class="ghost sm" data-act="pick-nav" data-id="-3">Früher</button><button class="ghost sm" data-act="pick-nav" data-id="3">Später</button>
      <button class="ghost sm" data-act="pick-set" data-id="">Ohne Termin</button><button class="ghost sm" data-act="pick-close">Schließen</button></div>
    <div class="wgrid">`;
  for (let k = 0; k < 6; k++){
    const first = addMonths(pick.ab, k), month = first.slice(0, 7);
    let m = mondayOf(first); if (addDays(m, 3).slice(0, 7) < month) m = addDays(m, 7);
    const zellen = [];
    for (; addDays(m, 3).slice(0, 7) === month; m = addDays(m, 7)){
      const b = belegt(m), lock = minS && m < minS, sel = cur && m >= cur && m < addDays(cur, lang * 7);
      const alt = m < heute, ok = !lock && !alt;
      const cls = sel ? 'sel' : b ? 'busy ein' : lock ? 'lock' : alt ? 'nofit' : !passt(m) ? 'free ein' : 'free';
      const tip = sel ? 'Aktueller Zeitraum dieses Sprints' : alt ? 'Liegt in der Vergangenheit' : lock ? 'Vor der Voraussetzung oder dem frühesten Start' : b ? `Belegt durch „${b.name}“. Klicken schiebt diesen Sprint davor ein: „${b.name}“ und alle folgenden rücken nach hinten.` : !passt(m) ? `Die Lücke ist kürzer als ${lang} Woche(n). Klicken schiebt ein, die folgenden Sprints rücken nach hinten.` : 'Frei. Klicken setzt den Start auf diese Woche.';
      zellen.push(`<button class="wk ${cls}${m < heute ? ' past' : ''}" ${ok && !sel ? `data-act="pick-set" data-id="${m}"` : 'disabled'} title="${esc(tip)}"${b ? ` style="--wc:${sprintFarbe(b)}"` : ''}><b>KW ${kw(new Date(m + 'T00:00:00'))}</b><span>ab ${dat(m).slice(0, 6)}</span>${b ? `<i>${esc(b.name)}</i>${!sel && ok ? '<em class="einl">einschieben</em>' : ''}` : sel ? '<i>dieser Sprint</i>' : ''}</button>`);
    }
    h += `<div class="wmon">${esc(fmtLong(first, {month: 'long', year: 'numeric'}))}</div><div class="wweeks">${zellen.join('')}</div>`;
  }
  return h + `</div><div class="wlegend muted small"><span><i class="lg free"></i>frei</span><span><i class="lg sel"></i>dieser Sprint</span><span><i class="lg busy"></i>belegt: Klick schiebt davor ein, die folgenden rücken nach hinten</span><span><i class="lg lock"></i>vor der Voraussetzung</span></div></div>`;
}
const pickLabel = (start, wochen) => start ? `${kwText(start)}, ${dat(start).slice(0, 6)} bis ${dat(addDays(start, Math.max(1, wochen) * 7 - 3))}` : 'ohne Termin';

let leihHtml = '';
/* ---------- ARCHIV: alle Sprints und Kleinprojekte ---------- */
let arch = {q: '', typ: '', status: '', person: '', projekt: '', von: '', bis: '', sort: 'von', dir: -1};
const ARCH_STATUS = ['Geplant', 'Läuft', 'Abgeschlossen', 'Ohne Termin', 'Überfällig', 'Erledigt'];
const stKlasse = st => ({'Geplant': 'geplant', 'Läuft': 'laeuft', 'Abgeschlossen': 'fertig', 'Ohne Termin': 'ohne', 'Überfällig': 'ueber', 'Erledigt': 'fertig'})[st] || '';
function archivDaten(){
  const heute = todayIso(), rows = [];
  for (const s of S.sprints){
    const xs = pl(s.id), ende = s.start ? addDays(s.start, s.wochen * 7 - 3) : '';
    const leute = [...new Set(xs.map(x => x.personId).filter(Boolean))].map(id => (byId(S.people, id) || {}).name).filter(Boolean);
    const o = owner(s);
    rows.push({typ: 'Sprint', id: s.id, name: s.name, projekt: s.projekt || '', person: o ? o.name : '', pid: s.personId || '', leute,
      von: s.start || '', bis: ende, h: xs.reduce((a, x) => a + (+x.stunden || 0), 0), geliehen: xs.filter(x => x.geliehen).reduce((a, x) => a + (+x.stunden || 0), 0),
      status: !s.start ? 'Ohne Termin' : ende < heute ? 'Abgeschlossen' : s.start <= heute ? 'Läuft' : 'Geplant',
      suche: [s.name, s.projekt, o && o.name, ...leute, ...xs.map(x => taskLabel(x) + ' ' + (x.notiz || ''))].join(' ').toLowerCase()});
  }
  for (const q of (S.klein || [])){
    const p = byId(S.people, q.personId), seg = q.segmente || [], von = seg.length ? seg[0].datum : q.deadline;
    rows.push({typ: 'Kleinprojekt', id: q.id, name: kpTitel(q), projekt: q.projekt || '', person: p ? p.name : '', pid: q.personId || '', leute: [],
      von, bis: q.deadline, h: +q.stunden || 0, geliehen: 0,
      status: q.erledigt ? 'Erledigt' : q.deadline < heute ? 'Überfällig' : von <= heute ? 'Läuft' : 'Geplant',
      suche: [kpVoll(q), q.notiz, p && p.name, q.taskId ? taskLabel(q) : ''].join(' ').toLowerCase()});
  }
  return rows;
}
function archivFilter(rows){
  const w = arch.q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  return rows.filter(r => (!arch.typ || r.typ === arch.typ) && (!arch.status || r.status === arch.status)
      && (!arch.person || r.pid === arch.person || (r.typ === 'Sprint' && pl(r.id).some(x => x.personId === arch.person)))
      && (!arch.projekt || (r.projekt || 'Ohne Projekt') === arch.projekt)
      && (!arch.von || (r.bis && r.bis >= arch.von)) && (!arch.bis || (r.von && r.von <= arch.bis))
      && w.every(x => r.suche.includes(x)))
    .sort((a, b) => { const va = a[arch.sort], vb = b[arch.sort]; const c = typeof va === 'number' ? va - vb : String(va || '').localeCompare(String(vb || '')); return c * arch.dir || a.name.localeCompare(b.name); });
}
function archivTabelle(rows){

  </tbody></table></div>`;
}

      ${raus.length ? `<div class="muted small" style="margin-top:6px">Verliehen: ${[...new Set(raus.map(x => x.sprintId))].map(id => { const b = byId(S.sprints, id), xs = raus.filter(x => x.sprintId === id); return `${fmt(xs.reduce((a, x) => a + (+x.stunden || 0), 0))} h an „${esc(b.name)}“ in ${[...new Set(xs.map(x => kwText(addDays(b.start, x.week * 7))))].join(', ')}`; }).join('; ')}</div>` : ''}

  const rows = [...S.people].sort((a, b) => (a.id === sp.personId ? -1 : b.id === sp.personId ? 1 : 0));

    h += `<tr class="${zeigen ? '' : 'dim'}"><td class="lbl" style="border-left:6px solid ${farbe(p)}">${esc(p.name)}${isOwner ? ' <span class="tag">Owner</span>' : ''}

      <div class="muted small blk${isOwner ? (passt ? ' ok' : ' warn') : ''}">Block ${fmt(btSum)} von ${fmt(zt)} Tagen${!passt ? ` <button class="linkbtn" data-act="sblk-auto" data-id="${sp.id}:${p.id}">Vorschlag</button>` : ''}</div>` : ''}
      ${isOwner ? `<div class="muted small" style="font-weight:400">${fmt(capSprint(p, sp))} h je Woche für Aufgaben</div>` : (() => { const bu = buchungVon(sp, p.id); return `<div class="muted small" style="margin-top:6px">Mitarbeit buchen auf</div>

function autoplan(){
  const sp = sprint();
  if (!sp) return toast('Bitte zuerst einen Sprint wählen.');
  const own = owner(sp);
  if (!own) return toast('Bitte dem Sprint zuerst einen Owner zuordnen.');
  const before = snap();
  const open = pl(sp.id).filter(x => x.week == null).sort((a, b) => b.stunden - a.stunden);
  if (!open.length) return toast('Der Aufgaben-Pool dieses Sprints ist leer.');
  // Wochenbilanz je Person: Owner-Aufgaben gegen Sprintzeit, Mitarbeit zuerst gegen Block-Zeit
  const base = sp.start ? buildLoads() : null, plus = {own: new Map(), b: new Map(), z: new Map()};
  const key = (p, w) => p.id + '|' + w;
  const art = p => p.id === own.id ? 'own' : buchungVon(sp, p.id) === 'sprint' ? 'z' : 'b';
  const free = (p, w) => {
    if (!base) return capSprint(p, sp) - loadOf(p, sp.id, w);
    const mo = addDays(sp.start, w * 7), e = base.get(p.id + '|' + mo) || {all: 0, help: 0, helpB: 0, helpZ: 0};
    const g = k => plus[k].get(key(p, w)) || 0;
    const ownH = e.all - e.help - (e.klein || 0) + g('own'), hB = e.helpB + (e.klein || 0) + g('b'), hZ = e.helpZ + g('z');
    const cap = capW(p, mo), B = Math.max(0, (+p.stunden || 0) - cap);
    return art(p) === 'b' ? B + cap - ownH - hB - hZ : cap - ownH - hZ - Math.max(0, hB - B);
  };
  const add = (p, w, h) => { if (!base) return; const m = plus[art(p)]; m.set(key(p, w), (m.get(key(p, w)) || 0) + h); };
  const next = sp.start ? S.sprints.filter(s => s.id !== sp.id && s.personId === own.id && s.start && s.start > sp.start).sort(byStart)[0] : null;
  const MAXW = next ? Math.max(1, wdiff(sp.start, next.start)) : 52;
  let fit = 0, split = 0, left = 0;
  for (const it of open){
    const p = byId(S.people, it.personId) || own;
    let placed = false;
    for (let w = 0; w < MAXW; w++){
      if (free(p, w) + 1e-9 >= it.stunden){ it.personId = p.id; it.week = w; it.tag = null; add(p, w, +it.stunden || 0); placed = true; fit++; break; }
    }
    if (placed) continue;
    if (planCap(p) < 0.5){ left++; continue; }
    let rest = +it.stunden || 0;
    const parts = [];
    for (let w = 0; w < MAXW && rest > 1e-9; w++){
      const h = Math.min(rest, Math.floor(free(p, w) * 2) / 2);
      if (h <= 0 || h < Math.min(0.5, rest)) continue;
      if (!parts.length){ it.personId = p.id; it.week = w; it.tag = null; it.stunden = h; parts.push(it); }
      else { const n = {id: uid(), sprintId: sp.id, taskId: it.taskId, personId: p.id, week: w, stunden: h, notiz: it.notiz || null, art: it.art || null}; S.placements.push(n); parts.push(n); }
      add(p, w, h); rest -= h;
    }
    if (!parts.length){ left++; continue; }
    if (rest > 1e-9){ const n = {id: uid(), sprintId: sp.id, taskId: it.taskId, personId: p.id, week: null, stunden: rest, notiz: it.notiz || null, art: it.art || null}; S.placements.push(n); parts.push(n); left++; }
    parts.forEach((x, i) => { x.teil = (i + 1) + '/' + parts.length; });
    split++;
  }
  if (!finish(before)) return;
  toast(`${fit} Aufgaben eingeplant${split ? ', ' + split + ' große Aufgabe(n) auf mehrere Wochen aufgeteilt' : ''}${left ? ', ' + left + ' passen nicht in die freie Zeit vor dem nächsten Sprint von ' + own.name : ''}. Gerechnet mit den Stunden aus allen Sprints, Mitarbeit je nach Buchung aus Block- oder Sprintzeit. Sprintdauer: ${sprint().wochen} Woche(n).${zuletztVerschoben ? ' ' + zuletztVerschoben + ' Folge-Sprint(s) automatisch verschoben.' : ''}`);
}

function zugangStatus(m){
  if (!m) return '';
  if (m.user_id) return `<span class="tag ok">aktiv</span>`;
  const code = sync.neueCodes[m.email];
  return `<span class="tag warn">Einladung offen</span>${istAdmin() ? (code ? ` <code class="einlcode">${codeAnzeige(code)}</code> <button class="linkbtn" data-act="code-kopieren" data-id="${esc(m.email)}">Einladung kopieren</button>` : ` <button class="linkbtn" data-act="code-neu" data-id="${esc(m.email)}" title="Erzeugt einen neuen Einladungscode, der alte wird ungültig">Code neu erzeugen</button>`) : ''}`;
}
function zugangZelle(p){

        + (alt ? `<div class="muted small" style="margin-top:6px">${alt} vergangene Abwesenheit(en) gespeichert.</div>` : '')

  </div>

      ${sync.aktiv && istAdmin() ? `<select id="pZugang" aria-label="Zugang zur App"><option value="editor">darf bearbeiten</option><option value="viewer">nur ansehen</option><option value="admin">verwalten</option><option value="">kein Zugang</option></select>` : ''}
      <button data-act="add-person">Hinzufügen</button>

    <td class="num">${t.einheit ? `<input type="number" step="0.25" min="0" value="${t.proEinheit || 0}" data-act="task-edit" data-id="${t.id}" data-f="proEinheit" aria-label="Stunden je Einheit">` : '<span class="muted">–</span>'}</td>
    <td class="num">${t.einheit ? `<input type="number" step="0.5" min="0" value="${t.menge || 1}" data-act="task-edit" data-id="${t.id}" data-f="menge" aria-label="Standardmenge">` : '<span class="muted">–</span>'}</td>

    <td class="res">${fmt(aufwand(t))} h${t.einheit ? `<div class="muted small">bei ${fmt(t.menge || 1)} ${esc(einheitText(t.einheit, t.menge || 1))}</div>` : ''}</td>
    <td><button class="ghost sm x" data-act="del-task" data-id="${t.id}" aria-label="${esc(t.name)} löschen" title="Löschen">×</button></td></tr>${t.varianten ? varZeile(t) : ''}`;

    <datalist id="einheiten">${einheiten.map(e => `<option value="${esc(e)}">`).join('')}</datalist>

/* ---------- ANLEITUNG ---------- */
function vHelp(){
  return `<div class="card help">
  <h2>Anleitung</h2>
  <h3>1. Team anlegen</h3>
  <ol><li>Öffne <b>Team</b>.</li><li>Gib Name, Rolle und wöchentliche Kapazität (Stunden) ein und klicke auf <b>Hinzufügen</b>.</li>
  <li>Alles lässt sich später direkt in der Tabelle ändern.</li></ol>
  <h3>2. Aufgaben-Datenbank pflegen</h3>
  <ol><li>Öffne <b>Katalog</b>. Dort stehen bereits typische Marketing-Aufgaben mit geschätzten Stunden.</li>
  <li>Neue Aufgaben mit Kategorie und Stunden hinzufügen, bestehende direkt anpassen.</li></ol>
  <h3>3. Sprint anlegen</h3>
  <ol><li>Öffne <b>Sprintplan</b> und klicke auf <b>+ Neuer Sprint</b>.</li>
  <li>Name eingeben. Owner und Start sind optional: Ohne Start liegt der Sprint im Sprint-Pool, den Owner vergibst du später oder beim Einplanen im Kalender.</li>
  <li>Sprints desselben Owners überschneiden sich nie. Legst du einen Sprint in eine Woche, in der der Owner schon einen Sprint führt, wird er davor eingeschoben: Er übernimmt dessen Startwoche, und der getroffene Sprint rückt mit allen folgenden des Owners nach hinten. Die Abstände zwischen den Sprints bleiben erhalten, abhängige Sprints anderer Personen ziehen mit. Mit Rückgängig ist alles wieder wie vorher.</li>
  <li>In der Monatsansicht des Kalenders hat jede Person in jeder Woche eine eigene Zeile in ihrer Farbe. Ein Doppelklick auf eine freie Zeile legt dort einen Sprint für diese Person an. Die Farben stellst du unter <b>Team</b> ein.</li>
  <li>Die Dauer musst du nicht festlegen: Sie ergibt sich automatisch aus den Aufgaben. Maßgeblich ist der größere Wert aus der spätesten belegten Woche und den Wochen, die das Team für alle Aufgaben-Stunden braucht.</li>
  <li>Um den Sprint von Hand zu verlängern, ziehst du eine Aufgabe in die blasse Spalte „+ verlängern“ ganz rechts.</li>
  <li>Umbenennen und Person wechseln: oben im Sprintplan im Namensfeld bzw. in der Personenauswahl. Den Namen bestätigst du mit Enter.</li>
  <li>Ein Doppelklick auf einen Sprint im Kalender öffnet direkt seinen Sprintplan.</li></ol>
  <h3>Owner, Mitarbeit und Pools</h3>
  <ol><li>Jeder Sprint hat einen festen Owner. Einzelne Aufgaben kann trotzdem jede Person übernehmen: Wer eine Aufgabe bearbeitet, entscheidest du beim Verteilen, indem du sie im Sprintplan in die Zeile einer Person oder in der Wochenansicht auf deren Tag ziehst. Im Aufgaben-Pool sind Aufgaben bewusst noch niemandem zugeordnet; die Auto-Empfehlung gibt sie dem Owner.</li>
  <li>Die Soll-Stunden einer Person werden je Woche über alle Sprints zusammengerechnet, eigene Sprints und Mitarbeit. Überplante Wochen sind im Sprintplan rot und im Kalender mit rotem Rand markiert. Auch die Auto-Empfehlung rechnet mit diesen Stunden.</li>
  <li><b>Aufgaben-Pool:</b> Offene Aufgaben eines Sprints liegen im Sprintplan oben. Derselbe Pool erscheint in der Wochenansicht des Kalenders. Dort ziehst du Aufgaben auf eine Person und einen Tag, sie bleiben dann fest auf diesem Tag.</li>
  <li><b>Sprint-Pool:</b> Sprints ohne Termin. Lässt du beim Anlegen das Startdatum leer oder löschst es im Sprintplan, landet der Sprint im Pool. In Monats- und Wochenansicht ziehst du ihn in eine Woche, zurück in den Pool gezogen verliert er seinen Termin.</li></ol>
  <h3>4. Planen per Drag &amp; Drop</h3>
  <ol><li>Ziehe eine Aufgabe aus dem Katalog links in eine Zelle (Person × Woche).</li>
  <li>Ein Klick auf <b>+</b> legt die Aufgabe zunächst unter den Aufgaben-Pool ab. Von dort ziehst du sie in die Woche.</li>
  <li>Stunden einer Einplanung kannst du im Chip direkt ändern.</li>
  <li>Eine Zelle wird rot, wenn die Person in dieser Woche über ihre Kapazität kommt.</li>
  <li>Eine Aufgabe zurück in den Katalog zu ziehen entfernt sie aus dem Plan.</li></ol>
  <h3>Zielauslastung und Block-Tage</h3>
  <p>Unter <b>Team</b> legst du je Person die Zielauslastung fest: den Anteil der Wochenstunden für Sprintaufgaben. Den Rest, also Tagesgeschäft, Revisionen und Daily Doing, markiert der Owner im Sprintplan je Sprint als Block-Tage. Einmal klicken blockt den ganzen Tag, zweimal den halben, ein dritter Klick gibt ihn frei. „Vorschlag“ setzt die Tage passend zum Ziel. Ein Sprint gilt erst als vollständig, wenn die Block-Tage des Owners grob dem Ziel-Block entsprechen. Unvollständige Sprints tragen im Kalender eine orange Unterkante. Ohne markierte Tage wird nichts geblockt angezeigt, gerechnet wird dann mit der Zielauslastung.</p>
  <h3>Sprint anlegen und Start</h3>
  <p>Wähle zuerst den Owner. Ein Klick auf „Start“ öffnet einen Kalender mit sechs Monaten: Freie Wochen sind anklickbar. Belegte Wochen zeigen den Sprint, der dort liegt; ein Klick schiebt deinen Sprint davor ein, und die folgenden rücken nach hinten. Wochen vor einer Voraussetzung sind schraffiert. Ein Owner führt immer nur einen Sprint gleichzeitig, mitarbeiten kann er in beliebig vielen.</p>
  <h3>Automatisches Verschieben</h3>
  <p>Passt eine Aufgabe nicht mehr in die Woche, etwa weil du Stunden erhöhst, sie einer vollen Person gibst oder Block-Tage setzt, wandert genau der Überhang in die Folgewoche desselben Sprints. Ist der Sprint dort zu Ende, verlängert er sich. Bestehende Überplanungen gleichst du mit „Überhang in die Folgewoche schieben“ in der Zelle oder mit „Ausgleichen“ unter Konflikte aus. Wird ein Sprint durch mehr Stunden länger, rücken alle folgenden Sprints seines Owners um dieselbe Zahl Wochen nach hinten, abhängige Sprints anderer Owner ziehen mit. Wird er kürzer, rücken die folgenden Sprints des Owners entsprechend nach vorne, aber nie vor ihre Voraussetzungen. Eine Meldung nennt, wie viele Sprints verschoben wurden.</p>
  <h3>Mitarbeit und Block-Zeit</h3>
  <p>Block-Tage setzt nur der Owner eines Sprints, Zuarbeiter haben ihre Block-Tage in ihren eigenen Sprints. Für jeden Zuarbeiter wählst du im Sprintplan, worauf seine Mitarbeit gebucht wird: „Blockzeit“ (Standard) zieht zuerst von seiner Blockzeit ab und nur den Rest von seiner Sprintzeit, „Sprintzeit“ bucht die Stunden voll auf sein Sprint-Zeitkonto. In beiden Fällen zeigt jede Wochenzelle, was noch frei ist. Übersteigt die Mitarbeit die Blockzeit, wird die Zelle orange, es erscheint ein Hinweis, und der Fall steht unter „Konflikte“: Die Woche ist dann zwar nicht überplant, aber für Tagesgeschäft und Revisionen bleibt keine Blockzeit mehr. Wird jemand überplant, erscheint sofort eine Warnung, und der Fall steht im Dashboard unter „Konflikte“.</p>
  <h3>Neuer Entwurf, Adaption oder Änderung</h3>
  <p>Bei gestalteten und getexteten Produkten wie Flyer, Anzeige, Banner, Präsentation, Social-Post oder Newsletter wählst du die Art der Aufgabe: ein neuer Entwurf, eine Adaption eines bestehenden Entwurfs oder nur Änderungen. Jede Art hat im Katalog eigene Zeiten, bei skalierbaren Produkten auch je Einheit; ein Flyer kostet zum Beispiel als Entwurf 6 h plus 3,5 h je Seite, als Adaption 2 h plus 1,5 h je Seite und als Änderung 1 h plus 0,5 h je Seite. Im Sprintplan steht die Auswahl auf jeder Aufgabe, im Kleinprojekt-Formular unter der Aufgabe. Unter „Katalog“ schaltest du die Varianten je Aufgabe ein und passt die Zeiten an. Eine Menge gibt es nur noch dort, wo sie den Aufwand wirklich bestimmt: Seiten, Folien, Formate, Bilder, Videominuten und Standorte.</p>
  <h3>Team-Synchronisation</h3>
  <p>Mit einer Supabase-Datenbank arbeitet das ganze Team live am selben Plan: Wer etwas ändert, speichert sofort, und alle anderen sehen es nach wenigen Sekunden. Oben rechts steht, ob die Verbindung steht und wer gerade online ist; das Dashboard zeigt die letzten Änderungen im Team. Neue Kolleginnen und Kollegen lädt ein, wer die Rolle „verwalten“ hat: unter „Team“ die E-Mail eintragen und den Zugang wählen. Die App zeigt einen Einladungscode; den gibst du zusammen mit dem Link weiter (Knopf „Einladung kopieren“). Beim ersten Öffnen klickt die Person auf „Erstmals hier?“, wählt ein Passwort und gibt den Code ein. Der Code gilt nur einmal. Rollen: verwalten (alles, auch Zugänge), bearbeiten, nur ansehen. Wer nur ansehen darf, kann nichts speichern. Rückgängig nimmt nur die eigenen Änderungen zurück; was jemand anderes inzwischen an denselben Einträgen geändert hat, bleibt stehen. Arbeiten zwei Personen gleichzeitig am selben Sprint, gilt die zuletzt gespeicherte Änderung. Ohne Verbindung speichert die App wie bisher nur im Browser.</p>
  <h3>Feiertage und Abwesenheiten</h3>
  <p>Gesetzliche Feiertage in Niedersachsen sind automatisch eingerechnet: Sie verringern Sprintzeit und Blockzeit der Woche und stehen im Kalender. Urlaub, Krankheit oder Fortbildung trägst du unter „Team“ ein. Die Kapazität sinkt entsprechend, Aufgaben in betroffenen Wochen rutschen automatisch weiter, Kleinprojekte werden neu einsortiert. Im Kalender sind abwesende Tage grau schraffiert und beschriftet, im PDF gibt es eine Zeile „Abwesend / Feiertag“.</p>
  <h3>Rückgängig</h3>
  <p>Jede Änderung lässt sich rückgängig machen: über die Pfeile oben rechts, über „Rückgängig“ in der Meldung oder mit Strg+Z (am Mac Cmd+Z); Strg+Umschalt+Z stellt sie wieder her. Gemerkt werden die letzten 40 Schritte, solange die Seite offen ist.</p>
  <h3>Gesamtstunden einer aufgeteilten Aufgabe</h3>
  <p>Ist eine Aufgabe auf mehrere Wochen verteilt (Teil 1/3, 2/3 …), zeigt jeder Teil neben den Stunden der Woche das Feld „gesamt“. Änderst du dort die Gesamtstunden, verteilt das Programm sie ab der ersten Woche neu: jede Woche so viel, wie die Person Kapazität hat, der Rest in die Folgewochen. Reicht der Sprint nicht, wird er länger und die folgenden Sprints rutschen nach hinten; brauchst du weniger Stunden, wird er kürzer und sie rücken wieder vor.</p>
  <h3>Zeit borgen</h3>
  <p>Mit „Zeit borgen“ im Sprintplan verlängert sich ein Sprint nicht sofort, wenn eine Aufgabe des Owners über das Sprintende läuft. Er nimmt zuerst freie Sprintzeit aus dem vorherigen Sprint desselben Owners, dann aus dem nachfolgenden; erst wenn beides voll ist, verlängert er sich. Die geliehenen Stunden liegen tatsächlich in den Wochen des anderen Sprints und fehlen dort. Im Sprintplan stehen sie unter „Geliehene Zeit“, im Kalender als „+ geliehen“ beim leihenden und „an …“ mit gestricheltem Rahmen beim verleihenden Sprint, im PDF entsprechend gestrichelt. Wird die Checkbox ausgeschaltet, kommen die Stunden in den eigenen Sprint zurück.</p>
  <h3>Rückwärts-Dynamik</h3>
  <p>Teile, die automatisch in eine Folgewoche gerutscht oder geliehen sind, rücken von selbst zurück, sobald in den früheren Wochen wieder Platz ist, etwa weil du Stunden reduzierst. Wird der Sprint dadurch kürzer, rücken die folgenden Sprints des Owners nach vorne. Das × an einem automatisch verschobenen Teil gibt seine Stunden an die Ursprungswoche zurück; spätere Teile rücken eine Woche vor, und was nicht passt, läuft wieder über. Das × am ersten Teil entfernt die ganze Aufgabe nach einer Rückfrage. Ziehst du einen Teil selbst in eine andere Woche, bleibt er dort.</p>
  <h3>Archiv</h3>
  <p>Unter „Archiv“ stehen alle Sprints und Kleinprojekte mit Projekt, Person, Zeitraum, Stunden und Status. Die Suche findet Namen, Projekte, Aufgaben, Notizen und Personen; filtern kannst du nach Typ, Status, Person, Projekt und Zeitraum, sortieren per Klick auf die Spaltenköpfe. „Als CSV exportieren“ speichert die aktuelle Auswahl für Excel.</p>
  <h3>Kleinprojekte außerhalb der Sprints</h3>
  <p>Kleinkram legst du oben über „+ Kleinprojekt“ an: Name, Projekt, Aufgabe aus dem Katalog (bei skalierbaren Aufgaben mit Menge), Deadline und geblockte Zeit. Die geblockte Zeit kommt aus dem Katalog und lässt sich überschreiben. Das Programm plant das Kleinprojekt ab heute in die freie Blockzeit der Person bis zur Deadline ein, wenn nötig über mehrere Tage. Mitarbeit auf Blockzeit und andere Kleinprojekte sind dabei schon abgezogen. Gibt es in einer Woche keine markierten Block-Tage, gilt die Regel-Blockzeit aus der Zielauslastung, gleichmäßig auf die Tage verteilt. Reicht die freie Blockzeit bis zur Deadline nicht, lässt sich das Kleinprojekt nicht anlegen. Im Kalender stehen Kleinprojekte an ihren Tagen; abhaken gibt künftige Tage wieder frei, „neu einsortieren“ plant sie nach Änderungen erneut ein.</p>
  <h3>Konflikte</h3>
  <p>Das Dashboard sammelt alle Regelverstöße: Überschneidungen, verletzte Abhängigkeiten, Sprints ohne Owner, überplante Wochen, überfüllte Tage durch fest gelegte Aufgaben und unvollständige Block-Tage. Die Zahl steht auch in der Navigation am Dashboard.</p>
  <h3>Abhängigkeiten zwischen Sprints</h3>
  <ol><li>Im Sprintplan legst du unter „Abhängigkeiten“ fest, welche Sprints vorher abgeschlossen sein müssen. Liegt der Sprint dabei zu früh, rückt er automatisch hinter seine Voraussetzung.</li>
  <li>„Frühester Start“ legt fest, ab wann ein Sprint beginnen darf, etwa für Kampagnenwellen oder saisonale Themen.</li>
  <li>Änderungen, die eine Voraussetzung verletzen würden, werden nicht übernommen. Der Hinweis nennt den Sprint, der zuerst fertig sein muss.</li></ol>
  <h3>Planungsvorlage Marketing 2027</h3>
  <p>Unter <b>Daten</b> importierst du die Vorlage aus Jahresplanung 2027 und Kampagnenwellen der Alten Spinnerei. Alle Sprints liegen danach ohne Termin und ohne Owner im Sprint-Pool, alle Aufgaben im Aufgaben-Pool, die Abhängigkeiten sind hinterlegt. Ihr verteilt selbst: Sprint im Kalender in die Zeile der zuständigen Person ziehen, danach die Aufgaben in der Wochenansicht oder im Sprintplan zuteilen.</p>
  <h3>Zurücksetzen</h3>
  <p>Unter <b>Daten</b> löscht „Planung zurücksetzen“ alle Sprints, Team und Katalog bleiben erhalten. „Alles zurücksetzen“ stellt den Auslieferungszustand her. Beides fragt zur Sicherheit zweimal nach.</p>
  <h3>5. Auto-Empfehlung</h3>
  <ol><li>Klicke im Sprintplan auf <b>Auto-Empfehlung</b>.</li>
  <li>Das System plant jede ungeplante Aufgabe in die früheste Woche, in der jemand genug planbare Zeit hat. Große Aufgaben, die in keine Woche passen, werden automatisch auf mehrere Wochen aufgeteilt (Teil 1/3, 2/3 …). Der Sprint wird dabei so lang wie nötig.</li>
  <li>Danach prüfst du das Ergebnis und verschiebst Aufgaben nach Bedarf.</li></ol>
  <h3>6. Dashboard lesen</h3>
  <p>Das Dashboard zeigt Auslastung, Sprints, Team-Auslastung und Hinweise (Überlastungen, ungeplante Aufgaben).</p>
  <h3>7. Daten sichern</h3>
  <ol><li>Deine Daten werden automatisch im Browser gespeichert und bleiben nach dem Schließen erhalten.</li>
  <li>Regelmäßig unter <b>Daten</b> auf „Sicherung exportieren“ klicken. Die Datei dient als Sicherung.</li>
  <li>Auf einem anderen Gerät oder nach Browser-Reset stellst du die Daten mit <b>Importieren</b> wieder her.</li></ol>
  <h3>Kalender: Tag, Woche, Monat</h3>
  <ol><li>Oben rechts im Kalender wechselst du zwischen <b>Tag</b>, <b>Woche</b> und <b>Monat</b>. Mit den Pfeilen blätterst du, „Heute“ springt zurück, „Gehe zu“ öffnet ein beliebiges Datum, auch Jahre in der Zukunft.</li>
  <li><b>Monat:</b> Übersicht aller Sprints. Beim Scrollen nach unten werden laufend weitere Monate geladen. Hier legst du Sprints per Doppelklick an und verschiebst sie per Ziehen.</li>
  <li><b>Woche:</b> Montag bis Freitag je Person, mit Sprint, Aufgaben pro Tag und dem Revisions-Block.</li>
  <li><b>Tag:</b> Ein Arbeitstag mit Richtzeiten ab 8:00 Uhr, je Person eine Spalte.</li>
  <li>Die Verteilung der Aufgaben auf einzelne Tage ist ein Vorschlag des Systems, geplant wird weiterhin wochenweise im Sprintplan. Wo die Block-Tage liegen, stellst du unter <b>Team</b> ein.</li></ol>
  <h3>Aufgaben-Katalog und skalierbare Aufgaben</h3>
  <ol><li>Der Katalog enthält nur Tätigkeiten ohne Projektbezug, etwa „Flyer oder Broschüre gestalten“. Wofür eine Aufgabe in einem Sprint steht, zeigt die Notiz darunter. Die Stunden sind auf Junior-Niveau geschätzt.</li>
  <li>Jede Aufgabe hat Tags. Die Suche im Sprintplan findet Name, Kategorie und Tags, „Postwurf“ findet also auch den Flyer. Die Schnellfilter darunter suchen mit einem Klick nach häufigen Stichworten.</li>
  <li>Skalierbare Aufgaben haben einen Grundaufwand und Stunden je Einheit, zum Beispiel 4 h plus 2,5 h je Seite. Im Sprint stellst du die Menge ein, die Stunden rechnen sich dann neu. Von Hand überschreiben kannst du sie trotzdem.</li>
  <li>Unter <b>Katalog</b> legst du für jede Aufgabe fest, ob und wonach sie skaliert. Ein leeres Feld „Skaliert nach“ bedeutet fester Aufwand.</li></ol>
  <h3>Filter im Kalender</h3>
  <p>Oben im Kalender filterst du nach Projekt, Sprintname, Owner und Beteiligung. „Beteiligt“ zeigt alle Sprints, in denen eine Person Owner ist oder Aufgaben übernommen hat. Ausgeblendete Sprints erscheinen als gestrichelte Platzhalter, damit klar bleibt, dass die Zeile belegt ist. Der Sprint-Pool folgt denselben Filtern.</p>
  <h3>Berichte &amp; Kalender-Export</h3>
  <ol><li><b>PDF je Person:</b> Auf dem Dashboard unter „Berichte“ zuerst die Person wählen, dann den Zeitraum, dann „PDF erstellen“. Seite 1 zeigt Kennzahlen, den Zeitplan mit eigenen Sprints und Mitarbeit, die Auslastung je Woche und den Entscheidungsbedarf. Danach folgt der Wochenplan mit allen Aufgaben und Verantwortlichen.</li>
  <li><b>Kalenderdatei:</b> Auf dem Dashboard Sprint(s) und Person wählen und „Kalenderdatei (.ics)“ klicken. Jeder Sprint wird als Zeitraum eingetragen, jede Aufgabe als ganztägiger Eintrag Montag bis Freitag in ihrer Woche, als „frei“ markiert, damit Termine nicht blockiert werden.</li>
  <li>In claude.ai kommt die Kalenderdatei als ZIP-Datei. Erst entpacken (Doppelklick), dann die enthaltene .ics-Datei öffnen. In der lokal gespeicherten HTML-Datei kommt sie direkt als .ics.</li>
  <li><b>Outlook:</b> .ics-Datei doppelklicken oder per Datei → Öffnen und exportieren → Importieren/Exportieren → „iCalendar-Datei importieren“. <b>Thunderbird:</b> Termine und Aufgaben → Kalender → Rechtsklick → „Importieren“. <b>Google Kalender:</b> Einstellungen → Importieren &amp; Exportieren. Tipp: Am besten in einen eigenen Kalender „Sprintplan“ importieren, so lässt er sich ein- und ausblenden.</li>
  <li>Nach Änderungen am Plan einfach neu exportieren und erneut importieren. Bereits importierte Einträge werden in den meisten Kalendern aktualisiert statt doppelt angelegt.</li></ol>
  <h3>Einbinden und nutzen</h3>
  <ol><li>Die Datei <code>sprintplaner.html</code> auf deinem Rechner speichern.</li>
  <li>Per Doppelklick im Browser öffnen (Chrome, Edge, Firefox oder Safari). Eine Installation ist nicht nötig.</li>
  <li>Für schnellen Zugriff eine Verknüpfung auf dem Desktop oder ein Lesezeichen anlegen.</li>
  <li>Wichtig: Die Daten liegen im jeweiligen Browser. Für das Team ist der Export-/Import-Weg derzeit der einfachste Austausch.</li></ol>
  <h3>Erweitern</h3>
  <p>Das Tool ist modular aufgebaut: Jeder Bereich (Personen, Katalog, Sprintplan, Dashboard) ist ein eigener Baustein. Neue Module wie ein Budget-Tracker, eine Gantt-Ansicht, PDF-Export oder eine gemeinsame Online-Datenbank lassen sich ergänzen. Beschreibe einfach, was du brauchst.</p>
  </div>`;

function weekSchedule(p, monday){
  const D = (+p.stunden || 0) / 5, blk = blockDays(p, monday), frw = blockFr(p, monday), sp = sprintAt(p.id, monday);

  const mine = [];

    if (x.personId !== p.id || x.week == null) continue;
    const s = byId(S.sprints, x.sprintId);
    if (s && s.start && addDays(s.start, x.week * 7) === monday) mine.push({x, s});
  }
  mine.sort((a, b) => (a.s.personId === p.id ? 0 : 1) - (b.s.personId === p.id ? 0 : 1));

    const di = Math.min(4, Math.max(0, +x.tag)), h = +x.stunden || 0;

    }

    const kl = [];
    (S.klein || []).forEach(q => { if (q.personId === p.id) (q.segmente || []).forEach(sg => { if (sg.datum === d.date) kl.push({q, h: +sg.stunden || 0}); }); });

  let title;
  if (mode === 'day') title = fmtLong(calDate, {weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'});
  else if (mode === 'week'){ const m = mondayOf(calDate); title = `KW ${kw(new Date(m + 'T00:00:00'))}, ${fmtLong(m, {day: 'numeric', month: 'short'})} – ${fmtLong(addDays(m, 4), {day: 'numeric', month: 'short', year: 'numeric'})}`; }
  else title = fmtLong(firstOfMonth(calDate), {month: 'long', year: 'numeric'});
  let h = `<div class="card">
    <div class="caltool">
      <button class="ghost" data-act="cal-today">Heute</button>
      <div class="seg"><button class="icon" data-act="cal-step" data-id="-1" aria-label="Zurück" title="Zurück">${ICON.prev}</button><button class="icon" data-act="cal-step" data-id="1" aria-label="Weiter" title="Weiter">${ICON.next}</button></div>
      <div class="caltitle">${esc(title)}</div>
      <label class="goto">Gehe zu <input type="date" value="${calDate}" data-act="cal-goto"></label>
      <span class="spacer"></span>
      <div class="seg" role="group" aria-label="Ansicht">${[['day','Tag'],['week','Woche'],['month','Monat']].map(([k, l]) => `<button data-act="cal-mode" data-id="${k}" class="${mode === k ? 'on' : ''}" aria-pressed="${mode === k}">${l}</button>`).join('')}</div>
      <button class="ghost" data-act="ics">Kalenderdatei</button>
    </div>
    <details class="calopts"${calOpts || window.innerWidth > 700 ? ' open' : ''}><summary>Legende und Filter${filterActive() ? ' <span class="tag warn">Filter aktiv</span>' : ''}</summary>
    <div class="legend">${S.people.map(p => `<span>${dot(p)}${esc(p.name)}</span>`).join('')}<span class="muted"><i class="bm-key"></i>Block-Tag für Revisionen und Daily Doing</span><span class="muted"><i class="bm-key half"></i>halber Block-Tag, mit ½ markiert</span><span class="muted"><i class="kp-key"></i>Kleinprojekt in der Blockzeit</span><span class="muted"><i class="leih-key"></i>Woche mit verliehener Zeit</span><span class="muted"><i class="abw-key"></i>abwesend oder Feiertag (Niedersachsen)</span></div>
    <div class="calfilter">
      <label class="fld">Projekt<select data-act="cal-f" data-id="proj"><option value="">Alle Projekte</option>${[...new Set(S.sprints.map(s => s.projekt || 'Ohne Projekt'))].sort().map(p => `<option ${p === calF.proj ? 'selected' : ''}>${esc(p)}</option>`).join('')}</select></label>
      <label class="fld grow">Sprintname<input id="cfq" type="search" value="${esc(calF.q)}" placeholder="enthält …"></label>
      <label class="fld">Owner<select data-act="cal-f" data-id="owner"><option value="">Alle</option><option value="-" ${calF.owner === '-' ? 'selected' : ''}>ohne Owner</option>${S.people.map(p => `<option value="${p.id}" ${p.id === calF.owner ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select></label>
      <label class="fld">Beteiligt<select data-act="cal-f" data-id="person"><option value="">Alle</option>${S.people.map(p => `<option value="${p.id}" ${p.id === calF.person ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select></label>
      ${filterActive() ? `<span class="muted small">${S.sprints.filter(matchSprint).length} von ${S.sprints.length} Sprints</span><button class="ghost sm" data-act="cal-f-reset">Filter zurücksetzen</button>` : ''}
    </div></details>
  </div>`;
  if (!S.people.length) return h + `<div class="card empty">Lege zuerst unter „Team“ dein Team an.</div>`;
  return h + (mode === 'day' ? calDay() : mode === 'week' ? calWeek() : calMonth());
}

function calMonth(){
  const start = firstOfMonth(calDate);
  const pool = S.sprints.filter(s => !s.start);
  let h = `<div class="card spool" data-drop="pool">
    <div class="row" style="justify-content:space-between"><h2 style="margin:0">Sprint-Pool${pool.length ? ' (' + pool.length + ')' : ''}</h2><span class="muted small">In die Zeile einer Person ziehen: Der Sprint bekommt den Termin und, falls noch offen, diese Person als Owner. Hierher ziehen nimmt den Termin wieder heraus.</span></div>
    ${sprintPoolList()}
  </div>
  <div class="card">
    <div class="row" style="justify-content:space-between;margin-bottom:14px">
      <span class="muted small">Doppelklick auf eine freie Zeile legt einen Sprint für diese Person an. Sprints lassen sich zeitlich verschieben, der Owner bleibt dabei gleich. Gestrichelt: Mitarbeit in fremden Sprints. Roter Rand: Person ist in dieser Woche über alle Sprints überplant.</span>
      <button class="ghost sm" data-act="cal-earlier">Frühere Monate anzeigen</button>
    </div>`;
  for (let k = 0; k < 6 + calExtra; k++) h += monthBlock(addMonths(start, k));
  return h + `<div class="loadmore"><button class="ghost" data-act="cal-more">Weitere Monate laden</button><div class="muted small" style="margin-top:6px">Beim Scrollen werden automatisch weitere Monate geladen.</div></div></div>`;
}

function sprintPoolList(){
  const alle = S.sprints.filter(s => !s.start), pool = alle.filter(matchSprint).sort((a, b) => (a.projekt || '').localeCompare(b.projekt || '') || a.name.localeCompare(b.name));
  if (!alle.length) return '<div class="muted small" style="margin-top:8px">Leer. Alle Sprints haben einen Termin.</div>';
  if (!pool.length) return `<div class="muted small" style="margin-top:8px">Keiner der ${alle.length} Sprints im Pool passt zum Filter.</div>`;
  return `${filterActive() ? `<div class="muted small" style="margin-top:6px">${pool.length} von ${alle.length} passen zum Filter.</div>` : ''}<div class="spool-list">${pool.map(s => `<div class="item" draggable="true" data-drag="S:${s.id}:0" data-open="${s.id}" title="${esc(s.projekt || 'Ohne Projekt')}. Ziehen zum Einplanen, Doppelklick öffnet den Sprintplan"><span>${dot(owner(s))}${esc(s.name)}</span><b>${fmt(pl(s.id).reduce((a, x) => a + (+x.stunden || 0), 0))} h</b></div>`).join('')}</div>`;
}
function filterPool(){
  document.querySelectorAll('.spool-list .item').forEach(it => { it.hidden = !((!poolQ || it.dataset.name.includes(poolQ)) && (!poolP || it.dataset.proj === poolP)); });
}
// Geliehene Zeit im Monatsbalken: beim leihenden Sprint „+ geliehen“, beim verleihenden „an …“
const leihRein = s => S.placements.filter(x => x.geliehen && x.sprintId === s.id).reduce((a, x) => a + (+x.stunden || 0), 0);
const leihRaus = (s, m) => { const r = {}; S.placements.forEach(x => { if (!x.geliehen || x.leihVon !== s.id) return; const b = byId(S.sprints, x.sprintId); if (b && b.start && addDays(b.start, x.week * 7) === m) r[b.name] = (r[b.name] || 0) + (+x.stunden || 0); }); return r; };
const leihBadge = (s, m) => { const rein = leihRein(s), raus = leihRaus(s, m); return (rein ? ` <span class="o leih">+${fmt(rein)} h geliehen</span>` : '') + Object.entries(raus).map(([n, h]) => ` <span class="o leih">${fmt(h)} h an „${esc(n)}“</span>`).join(''); };
const marks = (p, monday) => p ? blockFr(p, monday).map((f, i) => f ? `<i class="bm${f < 1 ? ' half' : ''}" style="grid-column:${i + 1}" title="${f < 1 ? 'Halber' : 'Ganzer'} Block-Tag: Revision und Daily Doing">${f < 1 ? '<b>½</b>' : ''}</i>` : '').join('') : '';
const abwMarks = (p, monday) => { if (!p) return ''; let erst = true; return [0, 1, 2, 3, 4].map(i => { const a = abwTag(p, addDays(monday, i)); if (!a) return ''; const txt = a.art === 'Feiertag' ? '' : (erst ? p.name + ': ' : '') + a.art; if (a.art !== 'Feiertag') erst = false; return `<i class="abwm${a.art === 'Feiertag' ? ' ft' : ''}" style="grid-column:${i + 1}" title="${esc(p.name)}: ${esc(a.art === 'Feiertag' ? 'Feiertag, ' + a.name : a.name)}">${esc(txt)}</i>`; }).join(''); };
const halbe = (p, monday) => p ? blockFr(p, monday).map((f, i) => f > 0 && f < 1 ? `<i class="hb" style="grid-column:${i + 1}" title="Halber Block-Tag">½</i>` : '').join('') : '';
function monthBlock(first){
  const t = todayIso(), month = first.slice(0, 7);
  const last = addDays(addMonths(first, 1), -1);
  const weeks = [];
  for (let m = mondayOf(first); m <= last; m = addDays(m, 7)) weeks.push(m);
  let h = `<section class="month" id="m-${month}"><h3>${esc(fmtLong(first, {month: 'long', year: 'numeric'}))}</h3>
    <div class="mhead"><div></div>${['Mo','Di','Mi','Do','Fr','Sa','So'].map(d => `<div>${d}</div>`).join('')}</div>`;
  for (const m of weeks){
    const lanes = zeilen().map(p => { const s = sprintAt(p.id, m), ok = matchSprint(s); return {p, id: p.id, s: ok ? s : null, ghost: s && !ok ? s : null}; });
    const orphan = S.sprints.find(x => !owner(x) && covers(x, m) && matchSprint(x));
    if (orphan) lanes.push({p: null, id: '', s: orphan});
    const kz = lanes.map(l => kpTage(l.p, m)), extra = kz.filter(Boolean).length;
    const kpWrap = (idx, html) => html + (kz[idx] ? kpLane(lanes[idx].p, m, kz[idx]) : '');
    h += `<div class="mweek">
      <div class="mkw" style="grid-row:1 / span ${lanes.length + extra + 1}">KW ${kw(new Date(m + 'T00:00:00'))}</div>
      ${[0,1,2,3,4,5,6].map(i => {
        const d = addDays(m, i);
        const cls = [d.slice(0, 7) !== month ? 'out' : '', d === t ? 'today' : '', i > 4 ? 'we' : ''].join(' ');
        const ft = feiertag(d);
        return `<div class="mday ${cls}${ft ? ' ft' : ''}"><span>${+d.slice(8)}${d.slice(8) === '01' ? '. ' + esc(fmtLong(d, {month: 'short'})) : ''}</span>${ft ? `<em class="ftname">${esc(ft)}</em>` : ''}</div>`;
      }).join('')}
      ${lanes.map((l, idx) => kpWrap(idx, (() => {
        const e = l.p ? loadEntry(l.p.id, m) : {all: 0, help: 0, helpS: []};
        const wb = l.p ? wochenBilanz(l.p, m) : null;
        const ov = wb && wb.over ? ' over' : wb && wb.blockOver > 0.001 ? ' bover' : '';
        const tip = wb ? ` ${bilanzText(wb)}.` : '';
        const hs = filterActive() ? e.helpS.filter(matchSprint) : e.helpS;
        if (!l.s && hs.length) return `<div class="lane${ov}" style="--pc:${farbe(l.p)}" data-drop="wk:${m}:${l.id}" data-new="${l.id}:${m}"><div class="mbar help" data-open="${hs[0].id}" style="border-color:${farbe(l.p)}" title="Mitarbeit von ${esc(l.p.name)} in: ${esc(hs.map(q => q.name).join(', '))}.${tip}">Mitarbeit: ${esc(hs.map(q => q.name).join(', '))}${filterActive() ? '' : ', ' + fmt(e.help) + ' h'}</div>${marks(l.p, m)}</div>`;
        if (!l.s && l.ghost) return `<div class="lane${ov}" style="--pc:${farbe(l.p)}" data-drop="wk:${m}:${l.id}"><div class="mbar ghost" data-open="${l.ghost.id}" title="Durch den Filter ausgeblendet: ${esc(l.ghost.name)}"></div>${marks(l.p, m)}${abwMarks(l.p, m)}</div>`;
        if (!l.s) return `<div class="lane empty${ov}" style="--pc:${farbe(l.p)}" data-drop="wk:${m}:${l.id}" data-new="${l.id}:${m}" title="Doppelklick: neuer Sprint für ${esc(l.p.name)}">${marks(l.p, m)}${abwMarks(l.p, m)}</div>`;
        const c = sprintFarbe(l.s), off = wdiff(l.s.start, m);
        const cls = (off > 0 ? ' cl' : '') + (off < l.s.wochen - 1 ? ' cr' : '');
        return `<div class="lane${ov}" style="--pc:${farbe(l.p)}" data-drop="wk:${m}:${l.id}"><div class="mbar${cls}${sprintKomplett(l.s) ? '' : ' inc'}${Object.keys(leihRaus(l.s, m)).length ? ' verliehen' : ''}" draggable="true" data-drag="S:${l.s.id}:${off}" data-open="${l.s.id}" style="background:${barBg(l.p, c, m)};color:${textOn(c)}" title="${esc(l.s.name)}${l.p ? ', ' + esc(l.p.name) : ''} (Woche ${off + 1} von ${l.s.wochen}).${sprintKomplett(l.s) ? '' : ' Block-Tage noch nicht austariert.'}${tip} Doppelklick öffnet den Sprintplan.${(l.s.deps || []).length ? ' Voraussetzung: ' + esc((l.s.deps || []).map(d => (byId(S.sprints, d) || {}).name).filter(Boolean).join(', ')) : ''}">${l.s ? `<span class="t" style="background:${c}"><b class="who">${esc(l.p ? l.p.name : 'ohne Owner')}</b> ${esc(l.s.name)}${e.help > 0 ? ` <span class="o">+ ${fmt(e.help)} h Mitarbeit</span>` : ''}${leihBadge(l.s, m)}</span>` : ''}</div>${halbe(l.p, m)}${abwMarks(l.p, m)}</div>`;
      })())).join('')}
    </div>`;
  }
  return h + `</section>`;
}

function calWeek(){
  const m = mondayOf(calDate), t = todayIso();
  const days = [0,1,2,3,4].map(i => addDays(m, i));
  const groups = S.sprints.filter(s => s.start && covers(s, m) && matchSprint(s)).sort(byStart).map(s => ({s, xs: pl(s.id).filter(x => x.week == null)})).filter(g => g.xs.length);
  const pool = S.sprints.filter(s => !s.start);
  const poolChip = x => { const tk = byId(S.tasks, x.taskId), who = x.personId ? byId(S.people, x.personId) : null; return `<div class="chip unp" draggable="true" data-drag="P:${x.id}"${who ? ` style="border-left-color:${farbe(who)}"` : ''}><span>${esc(taskLabel(x))}${who ? ` <span class="tag">${esc(who.name)}</span>` : ''}</span><b>${fmt(x.stunden)} h</b></div>`; };
  let h = `<div class="plan"><div>
    <div class="card side" data-drop="pool"><h2>Aufgaben-Pool</h2>
      <div class="muted small" style="margin-bottom:6px">Offene Aufgaben der Sprints dieser Woche. Auf einen Tag ziehen teilt sie der Person zu, hierher zurückziehen legt sie wieder in den Pool.</div>
      ${groups.map(g => `<div class="pgrp">${dot(owner(g.s))}${esc(g.s.name)}</div>${g.xs.map(poolChip).join('')}`).join('') || '<div class="empty">Keine offenen Aufgaben in dieser Woche.</div>'}
    </div>
    <div class="card side" data-drop="pool"><h2>Sprint-Pool${pool.length ? ' (' + pool.length + ')' : ''}</h2>
      <div class="muted small" style="margin-bottom:6px">In die Zeile einer Person ziehen plant den Sprint ab dieser Woche ein. Ist noch kein Owner gesetzt, wird es diese Person.</div>
      ${sprintPoolList()}
    </div></div>
    <div class="card"><div class="weekwrap"><table class="wkv"><thead><tr><th class="pcol">Person</th>${days.map(d => `<th class="${d === t ? 'today' : ''}"><span class="wdn">${esc(fmtLong(d, {weekday: 'short'}))}</span> ${esc(fmtLong(d, {day: 'numeric', month: 'numeric'}))}</th>`).join('')}</tr></thead><tbody>`;
  for (const p of zeilen()){
    const {sp: sp0, days: sch, help: help0} = weekSchedule(p, m), c = farbe(p);
    const sp = matchSprint(sp0) ? sp0 : null, help = help0.filter(matchSprint);
    const used = sch.reduce((a, d) => a + d.used, 0);
    const w = sp ? wdiff(sp.start, m) : 0;
    h += `<tr class="sprintrow"><td class="pcol" rowspan="2" style="border-left:4px solid ${c}"><b>${esc(p.name)}</b><div class="muted small${wochenBilanz(p, m).over ? ' bad' : ''}">${bilanzText(wochenBilanz(p, m))}</div>${help.length ? `<div class="muted small">Mitarbeit: ${help.map(q => esc(q.name)).join(', ')}</div>` : ''}</td>
      <td colspan="5" data-drop="wk:${m}:${p.id}">${sp
        ? `<div class="wbar${sprintKomplett(sp) ? '' : ' inc'}" draggable="true" data-drag="S:${sp.id}:${w}" data-open="${sp.id}" style="background:${barBg(p, c, m)};color:${textOn(c)}" title="Eigener Sprint. Ziehen verschiebt ihn, Doppelklick öffnet den Sprintplan."><span class="t" style="background:${c}">${esc(sp.name)}<span class="o">Woche ${w + 1} von ${sp.wochen}</span></span></div>`
        : sp0 ? `<div class="wbar none">Eigener Sprint durch den Filter ausgeblendet</div>` : `<div class="wbar none" data-new="${p.id}:${m}" title="Doppelklick: neuer Sprint ab dieser Woche">Kein eigener Sprint in dieser Woche</div>`}</td></tr>
      <tr>${sch.map((d, i) => `<td class="wcell ${d.date === t ? 'today' : ''}${d.f >= 1 ? ' blkday' : d.f > 0 ? ' blkhalf' : ''}" data-drop="day:${p.id}:${m}:${i}"><button class="kplus" data-act="klein-hier" data-id="${p.id}|${d.date}" title="Kleinprojekt für ${esc(p.name)} mit Deadline an diesem Tag" aria-label="Kleinprojekt für ${esc(p.name)} mit Deadline an diesem Tag">+</button>${d.items.filter(it => it.kind === 'task' ? matchSprint(it.sprint) : it.kind !== 'klein' || kpPasst(byId(S.klein, it.id) || {})).map(it => itemHtml(it, c, p)).join('') || '<span class="muted small">frei</span>'}<div class="wsum">${fmt(d.used + (d.blockRest != null ? d.blockRest : d.block) + (d.klein || 0))} von ${fmt((+p.stunden || 0) / 5)} h</div></td>`).join('')}</tr>`;
  }
  return h + `</tbody></table></div><p class="muted small" style="margin:10px 0 0">Aufgaben aus allen Sprints einer Person werden zusammengerechnet. Auf einen Tag gezogene Aufgaben bleiben dort fest (Rahmen), die übrigen verteilt das System der Reihe nach auf die freien Stunden. Schraffierte Tage sind Block-Tage.</p></div></div>`;
}

function calDay(){
  if (wd(calDate) > 5) return `<div class="card empty">Am Wochenende ist nichts geplant. <button class="ghost sm" data-act="cal-step" data-id="1">Zum nächsten Arbeitstag</button></div>`;
  const m = mondayOf(calDate), i = wd(calDate) - 1, HH = 48, START = 8;
  const cols = zeilen().map(p => { const r = weekSchedule(p, m); return {p, sp: r.sp, day: r.days[i]}; });
  const hours = Math.max(8, Math.ceil(Math.max(...cols.map(c => Math.max((+c.p.stunden || 0) / 5, c.day.used + c.day.block)))));
  let h = `<div class="card"><div class="weekwrap"><div class="dayv" style="grid-template-columns:56px repeat(${cols.length}, minmax(190px, 1fr));--hh:${HH}px">
    <div class="dh"></div>
    ${cols.map(c => `<div class="dh" style="border-top:4px solid ${farbe(c.p)}"><b>${esc(c.p.name)}</b>
      <div class="small">${c.sp ? `<span class="chiplink" data-open="${c.sp.id}" title="Doppelklick öffnet den Sprintplan">${esc(c.sp.name)}</span>` : '<span class="muted">Kein Sprint</span>'}</div>
      <div class="muted small">${fmt(c.day.used)} von ${fmt(Math.max(0, c.day.cap))} h Aufgabenzeit</div></div>`).join('')}
    <div class="taxis" style="height:${hours * HH}px">${[...Array(hours + 1).keys()].map(k => `<span style="top:${k * HH}px">${START + k}:00</span>`).join('')}</div>
    ${cols.map(c => {
      let t0 = 0;
      const blocks = c.day.items.filter(it => it.kind === 'task' ? matchSprint(it.sprint) : it.kind !== 'klein' || kpPasst(byId(S.klein, it.id) || {})).map(it => {
        const from = t0; t0 += it.h;
        const label = it.kind === 'abw' ? esc(it.art === 'Feiertag' ? 'Feiertag: ' + it.name : it.name) : it.kind === 'klein' ? 'Kleinprojekt: ' + esc(it.name) : it.kind === 'block' ? (it.f < 1 ? 'Halber Block-Tag: Revision &amp; Daily Doing' : 'Block-Tag: Revision &amp; Daily Doing') : esc(it.name) + (it.teil ? ' (Teil ' + esc(it.teil) + ')' : '') + (it.sprint.personId !== c.p.id ? ', Mitarbeit' : '');
        return `<div class="dblk${it.kind === 'block' ? ' block' : it.kind === 'klein' ? ' klein' : it.kind === 'abw' ? ' abw' : ''}${it.over ? ' over' : ''}" style="top:${from * HH + 2}px;height:${Math.max(it.h * HH - 4, 20)}px;${it.kind !== 'task' ? '' : 'border-left-color:' + sprintFarbe(it.sprint)}"><b>${label}</b><span>${clock(START + from)} – ${clock(START + t0)}, ${fmt(it.h)} h</span></div>`;
      }).join('');
      return `<div class="dcol${c.sp ? '' : ' free'}" style="height:${hours * HH}px"${c.sp ? '' : ` data-new="${c.p.id}:${m}" title="Doppelklick: neuer Sprint ab dieser Woche"`}>${blocks}</div>`;
    }).join('')}
  </div></div><p class="muted small" style="margin:10px 0 0">Richtzeiten ab 8:00 Uhr ohne Pausen. Grundlage ist die Wochenplanung im Sprint, die Aufteilung auf die Tage ist ein Vorschlag.</p></div>`;
  return h;
}
const wdiff = (start, m) => Math.round((new Date(m + 'T00:00:00') - new Date(start + 'T00:00:00')) / (7*864e5));

/* ---------- PDF-EXPORT: Monatsübersicht, A4 quer, zwei Monate pro Seite ---------- */
function pdfRange(){
  const now = todayIso().slice(0, 7), ss = S.sprints.filter(x => x.start);
  if (!ss.length) return [now, addMonths(now + '-01', 5).slice(0, 7)];
  let a = ss[0].start, b = a;
  for (const x of ss){ if (x.start < a) a = x.start; const e = addDays(x.start, x.wochen * 7 - 3); if (e > b) b = e; }
  return [a.slice(0, 7), b.slice(0, 7)];
}
const hexRgb = h => { h = String(h || '#888888').replace('#', ''); return [parseInt(h.substr(0, 2), 16), parseInt(h.substr(2, 2), 16), parseInt(h.substr(4, 2), 16)]; };
const mixHex = (a, b, t) => { const x = hexRgb(a), y = hexRgb(b); return '#' + x.map((v, i) => Math.round(v + (y[i] - v) * t).toString(16).padStart(2, '0')).join(''); };
function pdfHatch(doc, x, y, w, h, col, step){
  doc.setDrawColor(...hexRgb(col)); doc.setLineWidth(0.25);
  for (let t = -h; t < w; t += step){
    let x1 = x + t, y1 = y + h, x2 = x + t + h, y2 = y;
    if (x1 < x){ y1 -= (x - x1); x1 = x; }
    if (x2 > x + w){ y2 += (x2 - (x + w)); x2 = x + w; }
    if (x2 > x1) doc.line(x1, y1, x2, y2);
  }
}
function fitText(doc, str, maxW){
  if (doc.getTextWidth(str) <= maxW) return str;
  while (str.length > 1 && doc.getTextWidth(str + '…') > maxW) str = str.slice(0, -1);
